["第一題 邊緣型人格疾患（25%）","<b>(1) 行為特徵（DSM-5 九項準則，歸納四面向）</b><ul><li><b>人際</b>：極力避免真實或想像的被拋棄；關係不穩定而強烈，在理想化與貶抑間擺盪（分裂 splitting）。</li><li><b>自我</b>：身分認同紊亂、自我形象不穩；長期空虛感。</li><li><b>情緒</b>：情緒反應性強而不穩；不適當且強烈的憤怒。</li><li><b>行為</b>：至少兩個領域的衝動（花費、性、物質、暴食、魯莽駕駛）；反覆自殺行為、威脅或自傷；壓力相關的短暫妄想念頭或嚴重解離。</li></ul><b>(2) 處理與案主的關係</b><ol><li>建立穩定治療架構（frame）：固定時間、危機聯絡方式、清楚界線；言行一致、可預測。</li><li>同理加驗證（Linehan）：先肯定情緒的合理性，再談行為的有效性——「你的痛苦是真的，我們也一起找更有效的方法」。</li><li>面對分裂：不因被理想化而飄然，也不因被貶抑而防衛；維持整合態度，協助看見「好與壞可並存」。</li><li>處理反移情：常見拯救慾、憤怒、無力感；定期督導，避免過度付出或報復式越界。</li><li>自殺與自傷風險：持續評估、擬定安全計畫，必要時與精神科合作。</li><li>休假、結案前預先告知，逐步處理被拋棄的情緒。</li><li>可用取向：DBT（正念、痛苦耐受、情緒調節、人際效能）、MBT 心智化治療、TFP 移情焦點治療。</li></ol>"],
["第二題 Glasser 現實治療（25%）","<b>(1) 成功者與失敗者的行為特徵</b><br><b>成功認同</b>：願負責任（responsibility）、做對的事（right）、符合現實（reality）；以有效行為滿足五種基本需求（生存、愛與歸屬、權力、自由、樂趣）；與人有連結、自覺有價值。<br><b>失敗認同</b>：逃避現實與責任、否認或合理化；以無效的整體行為（憤怒、抱怨、症狀、成癮、退縮）換取暫時滿足；人際疏離、自覺沒價值。<br><b>(2) 成敗經驗如何影響自我認同</b><br>自我認同形成於「愛與被愛、價值感」的經驗：早期持續有效滿足需求（被愛、被肯定、能貢獻）累積為成功認同；反覆挫敗、被拒絕或貶抑，使人放棄有效途徑，形成失敗認同，並以自我應驗預言強化（我沒用→不嘗試→更失敗）。<br><b>(3) 對失敗認同案主的協助</b><ol><li>建立投入關係（involvement）：溫暖、真誠、不放棄、不批判，讓案主先體驗被在乎。</li><li>WDEP：Wants 探索想要什麼；Doing 聚焦現在做了什麼；Evaluation 評估行為是否帶來想要的結果；Planning 擬定具體可達成計畫。</li><li>計畫符合 SAMI²C³（簡單、可達成、可測量、涉及自己、立即、有承諾、持續）。</li><li>不接受藉口、不使用懲罰，讓案主承擔自然後果，同時協助重新嘗試。</li><li>提供小成功經驗與正向成癮（運動、閱讀、服務他人），逐步轉為成功認同。</li></ol>"],
["第三題 母親為憂鬱且有自殺意念的大二兒子求助（25%）","選擇學派：家族治療（結構式／系統觀點；簡述其他兩派作對照）。<br><b>0. 先處理危機</b>：與母親釐清兒子目前自殺風險（計畫、方法、既往嘗試），提供安全計畫（移除工具、安排陪伴、危機專線），確認是否已就醫；必要時轉介精神科評估。<br><b>1. 概念化</b>：兒子的憂鬱與自殺意念是家庭的「症狀攜帶者」，須放入脈絡——母子是否過度糾結（enmeshment）？父親／夫妻關係是否疏離？家庭對學業成就、獨立離家有何期待？大二是離家與自我認同的關鍵階段。<br><b>2. 目標</b>：①短期：確保安全、減少母親焦慮的過度介入；②中期：重整界線，母親回到支持者而非掌控者，邀請父親參與；③長期：兒子獲得自主與自我分化，家庭溝通更清楚。<br><b>3. 處遇</b><ul><li>先與母親會談（joining），肯定其關心並了解互動；邀請兒子（及父親）參與家庭會談，兒子不願意時先由母親練習改變互動。</li><li>運用 enactment（讓母子當場對話）觀察並重構互動；重新框架：把「憂鬱」視為訊號而非個人失敗。</li><li>調整界線：母親減少追問式關心，改為固定時間關心；強化夫妻次系統合作。</li><li>結合兒子個別晤談（或轉介），並與精神科合作。</li></ul><b>對照</b>：個人中心取向以同理、無條件正向關注陪伴；認知治療辨識「我是負擔」等自動化思考並做認知重建。"],
["第四題 非自願學生個案（25%）","<b>1. 理解非自願個案</b>：被導師轉介，常覺得「有問題的是老師，不是我」，表現沉默、敷衍、防衛。首先不是要他立刻改變，而是處理關係與動機。<br><b>2. 實務做法</b><ul><li>開場承認「你是被請來的」，接納其不情願，釐清轉介原因與他的看法；說明保密與保密限制。</li><li>與轉介教師合作，了解期待，把「老師想改變學生」轉為「學生想要什麼」。</li><li>尋找學生自己在意的目標（朋友、成績、被誤解），把諮商與其利益連結。</li><li>不強迫談問題，可從興趣、優勢談起，降低威脅。</li></ul><b>3. 理論佐證：焦點解決短期諮商（SFBT）</b><ul><li>關係類型：訪客型（visitor）——無求助意願，任務是建立合作關係，不給功課。</li><li>技術：讚美與肯定；例外問句；量尺問句；奇蹟問句，找出學生想要的目標。</li><li>重點：相信學生有資源與能力，小改變即可，由訪客型逐步轉為抱怨型、顧客型。</li></ul>輔以動機式晤談（MI）：探索矛盾、順著抗拒（roll with resistance）。"]],

["第一題 敘事取向與後現代生涯諮商（25%）",S(["For several decades, career theory and counseling theory have been dominated by liberal-humanism.|數十年來，生涯理論與諮商理論一直由自由人文主義所主導。","The self has been viewed as a stable, independent entity which can be best understood using objective methods, and the individual’s capacity for choice and autonomy has been emphasized.|自我被視為一個穩定、獨立的實體，最適合以客觀方法來理解，並且強調個人選擇與自主的能力。","The interest in narrative approaches to career counseling is an example of the broader enthusiasm for postmodern ideas which examine the ‘wider socio-cultural fabric in which we are all intertwined’ (Sinclair & Monk, 2005) and the discourses which inform social life.|對生涯諮商敘事取向的興趣，是更廣泛地熱衷後現代思潮的一個例子；後現代思潮檢視「我們所有人彼此交織其中的更廣大社會文化網絡」，以及形塑社會生活的各種論述。","From the Foucaultian perspective, language and discourse affect how we understand ourselves and how counselors work with their clients.|從傅柯的觀點來看，語言與論述影響我們如何理解自己，也影響諮商師如何與當事人工作。","Rather than display (relatively) static traits, for example abilities and interests, individuals are seen as speaking and acting in relation to particular contexts and to the discourses they have taken up.|個體並非展現（相對）靜態的特質，例如能力與興趣，而是被視為在特定情境中、並依其所採納的論述來說話與行動。","People experience multiple and competing discourses at any one time, and so any ‘objective understanding’ of the self is impossible.|人們在任何時刻都經驗到多重且相互競爭的論述，因此任何對自我的「客觀理解」都是不可能的。"])+"<div class='note'><b>單字片語</b>：liberal-humanism [ˈlɪbərəl ˈhjuːmənɪzəm] 自由人文主義｜entity [ˈɛntəti] 實體｜autonomy [ɔːˈtɑːnəmi] 自主｜narrative approach 敘事取向｜postmodern [ˌpoʊstˈmɑːdərn] 後現代的｜discourse [ˈdɪskɔːrs] 論述｜socio-cultural fabric 社會文化網絡｜intertwined [ˌɪntərˈtwaɪnd] 交織的｜Foucaultian [fuːˈkoʊltiən] 傅柯式的｜static trait 靜態特質｜take up (a discourse) 採納｜competing 相互競爭的｜be dominated by 被……主導</div>"],
["第二題 PHQ-8 在女性心肌梗塞患者的敏感度與特異度（25%）","<b>標題</b>：Sensitivity and Specificity of Patient Health Questionnaire (PHQ-8) in Female Patients with Myocardial Infarction ➜ 病人健康問卷（PHQ-8）在女性心肌梗塞患者之敏感度與特異度"+S(["【OBJECTIVES】Many clinicians and researchers have used eight-item Patient Health Questionnaire (PHQ-8), which was directly adapted from nine-item PHQ (PHQ-9) with the item measuring suicide intention excluded, to screen and to diagnose whether the individuals may be depressive.|許多臨床工作者與研究者使用八題版 PHQ-8——直接改編自九題版 PHQ-9，並排除測量自殺意圖的題項——來篩檢及診斷個體是否可能有憂鬱。","Even though the PHQ-8 has fewer items, practitioners and researchers have used the same criteria from PHQ-9 (i.e., total score greater than 10) to diagnose depression.|儘管 PHQ-8 題數較少，實務工作者與研究者仍沿用 PHQ-9 的同一標準（即總分大於 10）來診斷憂鬱。","The goal of the study was to evaluate sensitivity and specificity of PHQ-8 using different thresholds based on the data from the 2006 Behavioral Risk Factor Surveillance System (BRFSS).|本研究目的在於以 2006 年行為危險因子監測系統（BRFSS）的資料為基礎，使用不同閾值評估 PHQ-8 的敏感度與特異度。","【METHODS】The BRFSS is an on-going telephone health survey system, recording health and risk behaviors of US adults yearly.|BRFSS 是一個持續進行的電話健康調查系統，每年記錄美國成年人的健康與風險行為。","The participants were female residents of Washington who were diagnosed with myocardial infarction.|參與者為華盛頓州被診斷為心肌梗塞的女性居民。","【RESULTS】67 out of 221 patients (30%) were ever told that they had depressive disorders.|221 位病人中有 67 位（30%）曾被告知罹患憂鬱症。","Using PHQ-8 total score greater than 10 as diagnosis criteria, the majority of patients had no depression (61%).|以 PHQ-8 總分大於 10 作為診斷標準，大多數病人沒有憂鬱（61%）。","Using the threshold of 6, 7, 8, 9, 10, sensitivity was 59%, 50%, 38%, 31% and 43%, respectively.|以 6、7、8、9、10 為閾值時，敏感度分別為 59%、50%、38%、31% 與 43%。","Specificity was 81%, 86%, 91%, 92% and 95%, respectively.|特異度分別為 81%、86%、91%、92% 與 95%。","【CONCLUSIONS】Results suggested that the widely-used conventional criteria (total score > 10) may not result in optimal sensitivity and specificity.|結果顯示，廣泛使用的傳統標準（總分大於 10）可能無法產生最佳的敏感度與特異度。","To optimize PHQ-8 as a diagnosis tool, we recommend that researchers should evaluate cutoff points for targeted diseases when using PHQ-8.|為使 PHQ-8 成為最佳的診斷工具，我們建議研究者在使用時，應針對目標疾病評估其切截點。"])+"<div class='note'><b>單字片語</b>：sensitivity [ˌsɛnsəˈtɪvəti] 敏感度｜specificity [ˌspɛsəˈfɪsəti] 特異度｜myocardial infarction [ˌmaɪəˈkɑːrdiəl ɪnˈfɑːrkʃn] 心肌梗塞｜threshold [ˈθrɛʃhoʊld] 閾值｜cutoff point 切截點｜screen [skriːn] 篩檢｜surveillance [sərˈveɪləns] 監測｜adapt from 改編自｜criteria [kraɪˈtɪriə] 標準（criterion 複數）｜depressive disorder 憂鬱症｜respectively [rɪˈspɛktɪvli] 分別地｜optimal [ˈɑːptɪməl] 最佳的｜on-going 持續進行的</div>"],
["第三題 創傷倖存者與身體（30%）",S(["【Not Being a Whole Person】Having had to sever and deny his bodily nature, the survivor cannot fully be who he is.|由於不得不切斷並否認自己的身體本性，倖存者無法完整地成為他自己。","Lessening of pain also brings the lessening of pleasure.|痛苦的減輕同時也帶來愉悅的減少。","Protection from remembering also leaves him feeling less physically and concretely substantial.|避免回憶的保護機制，也讓他在身體與具體感受上覺得較不真實、不夠「實在」。","Avoidance of his body leaves him unable to develop physical skills and self functions (expression of emotion, standing his ground, setting physical boundaries, practicing self-defense).|對身體的迴避使他無法發展身體技能與自我功能（表達情緒、堅守立場、設定身體界線、練習自我防衛）。","【Not Being Grounded】Without a bodily aspect, the survivor has no base, no ground on which to weather and solidify her feelings and experience, because direct perception of our bodily nature is what gives us the concrete sense of our existence.|缺少身體這一面向，倖存者便沒有基礎、沒有可以承受並穩固其感受與經驗的根基，因為直接感知自己的身體本性，才讓我們對自身存在有具體的感覺。","Indeed, survivors often report feeling insubstantial, derealized, depersonalized, disconnected, weak, frail, and so on.|事實上，倖存者常表示自己感到虛浮不實、現實感喪失、失自我感、與人事物疏離、虛弱、脆弱等。","The survivor may move through life feeling disconnected from the present because she cannot feel her own bodily presence in the world.|倖存者可能在生活中始終與當下失聯，因為她感受不到自己身體在世界上的存在。","Moreover, memories of abuse tend to be overwhelming because the survivor has no physical container in which feelings can be held.|此外，受虐的記憶往往壓得人喘不過氣，因為倖存者沒有可以容納情緒的身體容器。","【Inability to Self-Regulate】How can we know what we really want or need if we cannot feel anything?|如果什麼都感覺不到，我們怎麼可能知道自己真正想要或需要什麼？","How can we act on our own behalf if the bodily basis of action is unavailable to us?|如果行動所依賴的身體基礎無法取用，我們又如何為自己採取行動？","One survivor did not know when he was hungry because he had so little awareness of his internal organs’ sensations.|有位倖存者不知道自己何時餓了，因為他對內臟的感覺覺察極少。","Since he was not particularly organized to eat by the clock, he would go for extended periods without eating.|由於他並不習慣按時間進食，因此常長時間不吃東西。","Eventually he would become low in blood sugar and quite cranky.|最後他會血糖過低而變得相當易怒。","Increased availability of internal body sensations, through body-oriented therapeutic work, allowed him better self-care and a more stable mood, although it also connected him to his feelings of hurt and deep sadness.|透過以身體為取向的治療工作，內在身體感覺變得更容易取得，使他能更好地自我照顧、情緒也更穩定，不過這也讓他接觸到受傷與深沉悲傷的感受。","Another survivor was unable to feel clearly and respond to her physical urges to walk away from situations where she felt her boundaries were not respected.|另一位倖存者無法清楚感覺並回應自己想要離開的身體衝動——在那些她覺得界線不受尊重的情境中。","This led her into submitting to sexual advances when she did not want to, tolerating the physical proximity of others even when it felt unpleasant, and so on.|這使她在不願意時屈從於性的示好、即使不舒服也忍受他人的身體靠近，諸如此類。","Relinking her urges to bodily actions, we eventually experimented with her pushing away and claiming more space for herself in the therapy room, which allowed her to experience more congruence between feeling and doing.|我們重新把她的衝動與身體行動連結起來，最後嘗試讓她在治療室裡做出推開的動作並為自己爭取更多空間，使她體驗到感受與行動之間更多的一致。","【Missing Pieces】Disconnection from the bodily self also makes unavailable the sensory awareness necessary for recovering significant memories of the abuse.|與身體自我的斷裂，也使得找回受虐重要記憶所必需的感官覺察無法取得。","Remembering is more like reconstructing than like accessing a recording, and a deadened body cannot support the recollection of bodily trauma.|回憶更像是重建，而非調取錄影，而一個麻木的身體無法支撐對身體創傷的回想。","To reconstruct or recreate in the present requires all the building blocks to be there: sensation, muscularity, sight, sound, insight, and so on.|要在當下重建或重現，需要所有的建構元素都在場：感覺、肌肉動作、視覺、聽覺、洞察等。","Memory is reconstruction, and without the sensations and feelings rooted in our body experience we lack the data necessary to reconstruct an event.|記憶即是重建，若沒有根植於身體經驗的感覺與感受，我們就缺乏重建事件所需的資料。","The survivor with little bodily awareness is left with disconnected fragments of the memory, which appear only as incoherent symptoms.|身體覺察很少的倖存者只剩下片段、不相連的記憶碎片，而這些只以不連貫的症狀形式出現。","【Somatic Symptoms and Shame】When the bodily recollection of trauma—the hurt and pain, the feelings of fear and disgust, the sensation of hands holding one down, the blows and so on—is disconnected from any awareness of the events from which it is evoked, then this bodily memory appears groundless, free-floating, without meaning or cause.|當創傷的身體回憶——傷痛、恐懼與厭惡的感受、被手壓制的感覺、拳打等——與引發它的事件之任何覺察脫節時，這個身體記憶就顯得無根、漂浮、沒有意義或原因。","Thus the bodily self may be experienced only as somatic symptoms, pain, discomfort, odd sensations, tensions, and habits.|因此，身體自我可能只以身體症狀、疼痛、不適、怪異感覺、緊繃與習慣的形式被經驗。","When we have symptoms or characteristics that have no apparent external cause, we tend to attribute them to some flaw in ourselves.|當我們有找不到明顯外在原因的症狀或特質時，傾向把它歸因於自己的某種缺陷。","The presence of these symptoms supports the sense of shame and badness that the survivor also feels for other reasons.|這些症狀的存在強化了倖存者原本就因其他原因而有的羞愧與「壞」的感受。","Without the context of the real events that the symptoms are responses to, the symptoms make the survivor feel sick, neurotic, pathological, and damaged.|缺少症狀所回應的真實事件作為脈絡，這些症狀讓倖存者覺得自己有病、神經質、病態、受了損傷。"])+"<div class='note'><b>單字片語</b>：sever [ˈsɛvər] 切斷｜bodily nature 身體本性｜substantial [səbˈstænʃl] 實在的｜self functions 自我功能｜stand one’s ground 堅守立場｜grounded [ˈɡraʊndɪd] 有根基的｜derealized [diːˈriːəlaɪzd] 現實感喪失｜depersonalized [diːˈpɜːrsənəlaɪzd] 失自我感｜insubstantial 虛浮不實的｜frail [freɪl] 脆弱的｜overwhelming 令人難以承受的｜self-regulate 自我調節｜cranky [ˈkræŋki] 易怒的｜body-oriented 以身體為取向的｜congruence [ˈkɑːŋɡruəns] 一致性｜deadened 麻木的｜reconstruct 重建｜fragment [ˈfræɡmənt] 碎片｜incoherent [ˌɪnkoʊˈhɪrənt] 不連貫的｜somatic [soʊˈmætɪk] 身體的｜free-floating 漂浮不定的｜attribute A to B 把 A 歸因於 B｜pathological [ˌpæθəˈlɑːdʒɪkl] 病態的</div><b>參考解答</b><br>五小節重點：不完整（痛苦↓愉悅↓）、沒有根基、無法自我調節、失落的拼圖（記憶＝重建）、身體症狀與羞愧。<br><b>實務</b>：Herman 階段取向、心理教育、著陸與身體覺察（titration／pendulation）、以動作練習界線。<b>適用</b>：童年虐待、C-PTSD、解離、難設界線者。"],
["第四題 結果論與生成取向的研究策略（20%）",S(["In the pursuit of the greatest number of answers, current scientific methodology utilizes two different research strategies that can lead to warranted knowledge claims.|為了追求最大量的答案，當前科學方法論運用兩種不同的研究策略，可導出有根據的知識主張。","These are consequentialist and generative approaches.|這兩種即是結果論取向與生成取向。","Consequentialist strategies justify knowledge claims by focusing on their consequences.|結果論策略藉由聚焦於知識主張的結果來證成其正當性。","By contrast, generative strategies justify knowledge claims in terms of the processes that produce them.|相對地，生成策略則依產生這些知識主張的過程來證成。","Although consequentialist strategies are used and promoted more widely in contemporary science, both types of strategy are required in an adequate conception of research methodology (Haig, 2005b, 383).|儘管結果論策略在當代科學中被更廣泛使用與倡導，但一個完備的研究方法論概念，兩類策略皆不可少。","What are the consequences if dialogue is actually a superior way of conceptualizing the two-person field of the working alliance?|如果對話其實是將工作同盟這個雙人場域概念化的較優方式，會有什麼後果？","Using a consequentialist approach in research, a person would use the results of dialogue and compare them with the results of using some other method.|在研究中採用結果論取向時，人們會使用對話所得的結果，並與採用其他方法所得的結果相比較。","A generative approach, by contrast, might consider what qualitative processes resulted in the assertion that dialogue formed a superior way of conceptualizing the working alliance; here people might refer to anecdotal evidence, philosophical development and rigor, contrast and comparison with other conceptualizations of the working alliance, and so forth.|相對地，生成取向可能探究是什麼樣的質性歷程導致「對話是概念化工作同盟的較佳方式」這項主張；此時人們可能引用軼事證據、哲學上的發展與嚴謹性、與其他工作同盟概念化的對照比較等。","The consequentialist and generative approaches are two kinds of processes, and both contribute to the generation and comparative evaluation of theories over time; consequentialist strategies usually take a quantitative path, while generative strategies can be seen as more closely aligned with qualitative methods.|結果論與生成取向是兩種歷程，兩者都有助於理論隨時間的產生與比較評鑑；結果論策略通常走量化路線，而生成策略可視為與質性方法更為契合。"])+"<div class='note'><b>單字片語</b>：warranted [ˈwɔːrəntɪd] 有正當理由的｜knowledge claim 知識主張｜consequentialist [ˌkɑːnsɪˈkwɛnʃəlɪst] 結果論的｜generative [ˈdʒɛnərətɪv] 生成的｜justify [ˈdʒʌstɪfaɪ] 證成｜by contrast 相對地｜conceptualize 概念化｜working alliance [əˈlaɪəns] 工作同盟｜two-person field 雙人場域｜anecdotal evidence 軼事證據｜rigor [ˈrɪɡər] 嚴謹性｜be aligned with 與……契合｜comparative evaluation 比較評鑑</div>"]]}};

["第一題 名詞解釋（30%，每題 5%）","<ol><li><b>wounded healer（受傷的療癒者）</b>：榮格（Jung）提出，源自希臘神話半人馬凱隆（Chiron）。治療者自身的受傷與痛苦經驗，成為同理他人、理解痛苦的來源；但需持續自我覺察與處理自身議題，否則易投射或產生反移情。</li><li><b>naturalistic-ethnographic research（自然主義民族誌研究）</b>：質性研究取向，研究者長時間置身自然情境（如輔導室、校園、特定族群），以參與觀察、訪談與文件蒐集，描述該群體的文化、意義與行為；研究者本身是研究工具，強調深描與脈絡。</li><li><b>emotion schemes（情緒基模）</b>：情緒取向治療（EFT，Greenberg）概念，由情境知覺、身體感受、動作傾向、記憶與意義統整而成的情緒處理結構；治療透過喚起、覺察並轉化不適應的情緒基模產生改變。</li><li><b>intensive single-subject design（密集單一受試設計）</b>：對單一或少數個案在基線期、介入期反覆測量，以個案自己作為對照（如 ABAB 撤除設計、多基線設計）；重視個別化與內在效度，適合臨床實務研究。</li><li><b>congruence（一致性／真誠）</b>：羅傑斯（Rogers）治療核心條件之一，治療者內在經驗、覺察與外在表達一致；也指當事人自我概念與經驗之間的一致，不一致即適應困難的來源。</li><li><b>process research（歷程研究）</b>：探討治療歷程中「發生了什麼、如何導致改變」，如治療關係、當事人與治療師行為、關鍵事件（事件分析、任務分析、CQR 等），而非只看療效結果（outcome research）。</li></ol>"],
["第二題 情緒聚焦困難：情緒淹沒與情緒空白（20%）","<b>答題架構</b>：先定義兩種現象（情緒調節不足／過度控制），再分別說明處理策略，最後強調共同原則（安全關係＋循序漸進＋尊重防衛）。<br><b>(1) 情緒淹沒（overwhelmed／under-regulated）——先穩定，再處理</b><ul><li>建立安全與穩定：放慢節奏、提高結構性、維持穩定的聲音與臨在。</li><li>教導調節與著陸技巧：呼吸、感官著陸、「清出空間」（Gendlin 的 clearing a space）、與情緒保持距離（把感受放在對面的椅子上）。</li><li>情緒命名（affect labeling）：以語言為情緒命名，降低強度。</li><li>調整暴露劑量（titration）：回憶創傷或強烈情緒時只觸碰一小部分，必要時中斷。</li><li>同理反映並肯定情緒的合理性，避免催促宣洩；待穩定後再進行意義探索。</li></ul><b>(2) 情緒空白（over-regulated／情緒封閉）——安全地喚起覺察</b><ul><li>探究封閉的功能：害怕被淹沒、羞愧、家庭或文化規範，尊重防衛而不強行突破。</li><li>從身體入手：聚焦（focusing）身體感受，如「胸口、喉嚨現在有什麼感覺？」</li><li>體驗性技術：空椅法、重述生動的情境細節、關注非語言線索、想像與角色扮演。</li><li>增加情緒詞彙與辨識能力（特別是述情障礙 alexithymia 傾向者）。</li><li>同理反映逐步擴大，使當事人在安全中慢慢接觸情緒。</li></ul>"],
["第三題 調查法、相關研究法、實驗法比較表（24%）","<div class='v'><table border='1' cellpadding='5' style='border-collapse:collapse;font-size:13px;border-color:var(--bd)'><tr><th>項目</th><th>調查法</th><th>相關研究法</th><th>實驗法</th></tr><tr><td>1 主要目的</td><td>描述母群現況、態度、意見與分布</td><td>探討變項間關聯的方向與強度，進行預測</td><td>驗證因果（操弄自變項，觀察依變項）</td></tr><tr><td>2 樣本特性</td><td>大樣本，隨機或分層抽樣，強調代表性</td><td>樣本數足夠，自然情境蒐集，不操弄變項</td><td>樣本較小，隨機分派至實驗組與控制組</td></tr><tr><td>3 研究工具</td><td>問卷、態度量表、訪談表</td><td>標準化測驗或量表（信效度良好）</td><td>實驗處理方案＋依變項測量工具（前後測）</td></tr><tr><td>4 題項</td><td>依主題編製，多為事實與態度題，可單題分析</td><td>以多題組成量表，涵蓋各研究變項</td><td>依變項題項需對處理效果敏感</td></tr><tr><td>5 研究程序</td><td>界定母群→抽樣→編製問卷→施測→回收分析</td><td>文獻→假設→選量表→施測→相關分析</td><td>假設→控制外擾→隨機分派→前測→處理→後測→分析</td></tr><tr><td>6 測量尺度</td><td>名義、次序為主，亦有李克特量表（準等距）</td><td>等距、比率（連續變項）為主</td><td>等距、比率為主，亦可類別</td></tr><tr><td>7 統計技術</td><td>次數分配、百分比、卡方檢定</td><td>Pearson／Spearman 相關、迴歸、路徑分析、SEM</td><td>t 檢定、ANOVA、ANCOVA、MANOVA</td></tr><tr><td>8 其他</td><td>範圍廣、成本低，無法推論因果</td><td>不能推論因果，須注意第三變項</td><td>內在效度高；外在效度與倫理受限，實務上常用準實驗設計</td></tr></table></div>"],
["第四題 當代諮商取向、代表學者與療效因子（26%）","<b>(1) 主要取向與代表人物</b><div class='v'><table border='1' cellpadding='5' style='border-collapse:collapse;font-size:13px;border-color:var(--bd)'><tr><th>取向</th><th>代表理論／治療法</th><th>代表學者</th></tr><tr><td>心理動力</td><td>古典精神分析、個體心理學、分析心理學、客體關係與自體心理學</td><td>Freud、Adler、Jung、Klein、Kohut</td></tr><tr><td>人本‧存在‧經驗</td><td>個人中心、完形、存在、意義治療、情緒取向治療</td><td>Rogers、Perls、May／Yalom、Frankl、Greenberg</td></tr><tr><td>認知行為</td><td>行為治療、認知治療、理情行為治療、DBT、ACT</td><td>Skinner／Wolpe、Beck、Ellis、Linehan、Hayes</td></tr><tr><td>後現代／建構</td><td>焦點解決短期治療、敘事治療</td><td>de Shazer、White & Epston</td></tr><tr><td>系統／家族</td><td>結構、經驗、多世代、策略家族治療</td><td>Minuchin、Satir、Bowen、Haley</td></tr><tr><td>其他／整合</td><td>現實治療、交流分析、跨理論模式與整合取向</td><td>Glasser、Berne、Prochaska、Norcross</td></tr></table></div><b>(2) 為什麼有效？三面向的改變機轉</b><ul><li><b>認知面</b>：獲得洞察與領悟（動力取向）、認知重建與核心信念修正（Beck、Ellis）、重新賦予意義與敘事改寫（敘事、存在）、增進自我覺察。</li><li><b>情感面</b>：情緒宣洩與表達、矯正性情緒經驗、被同理與無條件接納帶來的安全感（個人中心）、情緒覺察與調節、情緒轉化（EFT）。</li><li><b>行為面</b>：技能學習與演練、暴露與去敏感、強化與行為塑造、家庭作業；新行為的成功經驗提升自我效能（Bandura）。</li></ul><b>共同因子</b>：治療關係、希望與期待、合理的解釋模式（Frank；Wampold 脈絡模式）。三者互相牽動：認知改變帶動情緒與行為，行為成功又回頭修正認知。"]]};

["第一題 霸凌與網路霸凌（25%）",S(["Bullying is aggressive behavior that is intentional and involves an imbalance of power or strength.|霸凌是一種故意的攻擊行為，涉及權力或力量的不對等。","It is a repeated behavior and can be physical, verbal, or relational.|這是一種重複發生的行為，可以是身體的、言語的或關係的。","While boys may bully others using more physical means; girls often bully others by social exclusion.|男孩可能較常以身體手段霸凌他人，女孩則常以社交排擠的方式霸凌。","Bullying has been part of school, and even workplaces, for years.|多年來，霸凌一直是學校甚至職場的一部分。","More recently, though, technology and social media have created a new venue for bullying that has expanded its reach.|然而近來，科技與社群媒體創造了新的霸凌場域，擴大了其影響範圍。","Cyberbullying is bullying that happens online and via cell phones.|網路霸凌是發生在網路上及透過手機的霸凌。","Websites like Facebook, MySpace, Tumblr and Formspring allow kids to send hurtful, ongoing messages to other children 24 hours a day.|像 Facebook、MySpace、Tumblr 與 Formspring 這類網站，讓孩子一天 24 小時對其他孩子傳送傷人且持續不斷的訊息。","Some sites, such as Tumblr and Formspring allow messages to be left anonymously.|有些網站，如 Tumblr 與 Formspring，允許匿名留言。","Preventing and stopping bullying involves a commitment to creating a safe environment where children can thrive, socially and academically, without being afraid.|預防與制止霸凌需要承諾打造一個安全的環境，讓孩子能在社交與學業上蓬勃發展而不感到害怕。","APA recommends that teachers, parents and students take the following actions to address bullying.|美國心理學會（APA）建議教師、家長與學生採取以下行動來因應霸凌。"])+"<div class='note'><b>單字片語</b>：aggressive [əˈɡrɛsɪv] 攻擊性的｜imbalance of power [ɪmˈbæləns] 權力不對等｜relational bullying [rɪˈleɪʃənl] 關係霸凌｜social exclusion [ɪkˈskluːʒn] 社交排擠｜venue [ˈvɛnjuː] 場域｜reach 影響範圍｜cyberbullying [ˈsaɪbərˌbʊliɪŋ] 網路霸凌｜anonymously [əˈnɑːnɪməsli] 匿名地｜thrive [θraɪv] 蓬勃發展｜commitment to [kəˈmɪtmənt] 對……的承諾｜address (a problem) [əˈdrɛs] 處理（問題）</div>"],
["第二題 壮胎與心理健康（25%）",S(["The Council of Representatives of the American Psychological Association charged the Task Force on Mental Health and Abortion (TFMHA) with “collecting, examining, and summarizing the scientific research addressing the mental health factors associated with abortion, including the psychological responses following abortion, and producing a report based upon a review of the most current research.”|美國心理學會代表會委託「心理健康與壮胎工作小組」（TFMHA）「蒐集、檢視並彙整探討與壮胎相關的心理健康因素之科學研究，包括壮胎後的心理反應，並根據對最新研究的回顧撰寫報告」。","In considering the psychological implications of abortion, the TFMHA recognized that abortion encompasses a diversity of experiences.|在考量壮胎的心理意涵時，TFMHA 體認到壮胎涵蓋多樣的經驗。","Women obtain abortions for different reasons; at different times of gestation; via differing medical procedures; and within different personal, social, economic, and cultural contexts.|女性接受壮胎的原因不同、懷孕週數不同、醫療程序不同，且處於不同的個人、社會、經濟與文化脈絡。","All of these may lead to variability in women’s psychological reactions following abortion.|這一切都可能導致女性壮胎後心理反應的差異。","Consequently, global statements about the psychological impact of abortion on women can be misleading.|因此，對壮胎之於女性心理影響所作的籠統概括性陳述可能具有誤導性。","The TFMHA evaluated all empirical studies published in English in peer-reviewed journals post-1989 that compared the mental health of women who had an induced abortion to the mental health of comparison groups of women (N=50) or that examined factors that predict mental health among women who have had an elective abortion in the United States (N=23).|TFMHA 評估了 1989 年之後以英文發表於同儀審查期刊的所有實徵研究，這些研究若不是比較曾接受人工流產的女性與比較組女性的心理健康（N=50），就是探討在美國接受選擇性壮胎的女性中，預測其心理健康的因素（N=23）。","This literature was reviewed and evaluated with respect to its ability to address four primary questions:|這些文獻針對其回答下列四個主要問題的能力進行了回顧與評估：","Does abortion cause harm to women’s mental health?|壮胎是否會對女性的心理健康造成傷害？","How prevalent are mental health problems among women in the United States who have had an abortion?|在美國曾壮胎的女性中，心理健康問題的盛行率有多高？","What is the relative risk of mental health problems associated with abortion compared to its alternatives (other courses of action that might be taken by a pregnant woman in similar circumstances)? And,|相較於其他選擇（處於類似處境的孕婦可能採取的其他作法），壮胎所伴隨的心理健康問題相對風險為何？以及，","What predicts individual variation in women’s psychological experiences following abortion?|什麼因素可預測女性壮胎後心理經驗的個別差異？"])+"<div class='note'><b>單字片語</b>：charge A with B [tʃɑːrdʒ] 委託 A 負責 B｜encompass [ɪnˈkʊmpəs] 涵蓋｜gestation [dʒɛˈsteɪʃn] 懷孕期｜induced abortion [ɪnˈduːst əˈbɔːrʃn] 人工流產｜elective abortion [ɪˈlɛktɪv] 選擇性壮胎｜peer-reviewed 同儀審查的｜empirical study [ɛmˈpɪrɪkl] 實徵研究｜comparison group 比較組｜prevalent [ˈprɛvələnt] 盛行的｜relative risk 相對風險｜course of action 行動方案｜misleading [mɪsˈliːdɪŋ] 誤導的｜variability [ˌvɛriəˈbɪləti] 變異性</div>"],
["第三題 壓力事件中的意義建構（20%）",S(["Interest in meaning and meaning making in the context of stressful life events continues to grow, but research is hampered by conceptual and methodological limitations.|在壓力性生活事件的脈絡下，對意義與意義建構的興趣持續增長，但研究受限於概念與方法上的限制。","Drawing on current theories, the author first presents an integrated model of meaning making.|作者借鑑當前理論，首先提出一個整合性的意義建構模式。","This model distinguishes between the constructs of global and situational meaning and between “meaning-making efforts” and “meaning made,” and it elaborates subconstructs within these constructs.|此模式區分整體意義與情境意義兩個構念，並區分「意義建構的努力」與「所建構的意義」，同時詳述這些構念之下的子構念。","Using this model, the author reviews the empirical research regarding meaning in the context of adjustment to stressful events, outlining what has been established to date and evaluating the strengths and weaknesses of current empirical work.|作者運用此模式，回顧在壓力事件適應脈絡下有關意義的實徵研究，概述迄今已確立的發現，並評估現有實徵研究的優缺點。","Results suggest that theory on meaning and meaning making has developed apace, but empirical research has failed to keep up with these developments, creating a significant gap between the rich but abstract theories and empirical tests of them.|結果顯示，意義與意義建構的理論發展迅速，但實徵研究未能跟上，造成豐富卻抽象的理論與其實證檢驗之間出現顯著落差。","Given current empirical findings, some aspects of the meaning-making model appear to be well supported but others are not, and the quality of meaning-making efforts and meanings made may be at least as important as their quantity.|根據目前的實徵發現，意義建構模式的某些面向獲得良好支持，其他則否；而且意義建構努力與所建構意義的「品質」，可能至少與其「量」同樣重要。"])+"<div class='note'><b>單字片語</b>：meaning making 意義建構｜hamper [ˈhæmpər] 阻礙｜conceptual 概念上的｜draw on 借鑑、運用｜global meaning 整體意義｜situational meaning 情境意義｜construct [ˈkɑːnstrʊkt] 構念｜subconstruct 子構念｜elaborate [ɪˈlæbəreɪt] 詳述｜adjustment 適應｜apace [əˈpeɪs] 迅速地｜keep up with 跟上｜well supported 獲充分支持</div>"],
["第四題 自殺的風險因子：摘述並評論（30%）",S(["Worldwide, more people die by suicide every year than by homicides and all wars combined.|全球每年死於自殺的人數，比死於他殺與所有戰爭的總和還多。","Such mortality statistics clearly indicate the magnitude of the impact imposed by suicide on all societies, a particularly alarming fact considering that suicide is frequently an avoidable outcome when effective treatments are delivered.|這類死亡統計清楚顯示自殺對所有社會造成的衝擊之大；而考量到在提供有效治療時，自殺往往是可避免的結果，這一事實尤其令人憂心。","Suicide is the extreme of a continuum of behaviors commonly referred to as suicidal behaviors.|自殺是一連串通稱為自殺行為的連續譜之極端。","In this article, we will discuss data from studies investigating both suicide completers and suicide attempters interchangeably.|本文將交替討論針對自殺身亡者與自殺未遂者的研究資料。","However, we acknowledge that these two phenotypes are likely to only partly share underlying etiological and neurobiological mechanisms.|然而，我們承認這兩種表現型可能只有部分共享其潛在的病因與神經生物機制。","Suicide is a complex phenomenon with several distal and proximal risk factors.|自殺是一個複雜的現象，具有多個遠端與近端風險因子。","Among the latter, a strong and robust relationship exists between the presence of psychopathology, most notably major depressive disorder (MDD), and suicide risk.|在近端因子中，精神病理（尤其是重度憂鬱症）的存在與自殺風險之間，有強而穩固的關聯。","Comorbidity with substance disorders, such as alcohol and other drug dependences, is also frequently observed.|與物質使用障礙（如酒精與其他藥物依賴）的共病也經常被觀察到。","Recent life events conferring acute stress or experiences of demoralization, such as public humiliation or social rejection are frequent triggers of suicide, and a number of sociodemographic factors such as education, employment and income, among others, modify the impact of psychopathology on suicide risk.|帶來急性壓力或士氣喪失感的近期生活事件，如公開羞辱或社會拒絕，是自殺的常見誘因；而教育、就業、收入等若干社會人口因素，則會調節精神病理對自殺風險的影響。","Several factors are thought to contribute more distally to increase suicide risk.|有若干因素被認為在較遠端增加自殺風險。","Among these are constitutional and demographic factors such as gender and a family history of suicide, which plays a discrete but significant role.|其中包括體質與人口學因素，如性別，以及自殺家族史——後者的作用雖不大，但很顯著。","Genetic variation, according to consistent genetic epidemiological data, is thought to account for part of the familial aggregation of suicide, which is partially independent from the familial clustering of mental disorders.|根據一致的遺傳流行病學資料，基因變異被認為可解釋自殺在家族中聚集的一部分，而這部分與精神疾患的家族聚集在某種程度上是各自獨立的。","Certain personality traits, coping and cognitive styles have also been associated with distal suicide risk.|某些人格特質、因應與認知風格也與遠端的自殺風險有關。","In general, environmental variables explain a substantial amount of the total variance in suicidal behavior with stressful life events, low social support and quality of social environment among the most consistently-implicated risk factors.|整體而言，環境變項解釋了自殺行為總變異量的相當大部分，其中壓力性生活事件、低社會支持與社會環境品質，是最一致被指出的風險因子。","Among distal risk factors for suicide, a history of early life adversity is undoubtedly one of the factors with the strongest effects.|在自殺的遠端風險因子中，早年逆境史無疑是影響最強的因素之一。","Although most individuals who display suicidal behavior do not have a history of early-life adversity, a significant minority ranging from 10 to 40% (depending on type of abuse, frequency and suicide phenotype) does.|雖然多數表現自殺行為的人沒有早年逆境史，但有相當比例的少數（依虐待類型、頻率與自殺表現型而定，約 10% 至 40%）有此經歷。","Accordingly, several longitudinal studies conducted in epidemiologically representative samples consistently show that children who have histories of sexual and physical abuse during childhood are more likely to manifest suicidal behavior in adulthood, even after other variables conferring major effects such as psychopathology are controlled for.|因此，數個以流行病學代表性樣本進行的縱貫研究一致顯示，童年有性虐待與身體虐待史的孩子，成年後更可能出現自殺行為，即使在控制了精神病理等其他具重大影響的變項之後亦然。","Long-standing effects of childhood abuse on suicidal behavior risk are also seen in diverse clinical populations and observed using different study designs.|童年虐待對自殺行為風險的長期影響，也見於不同的臨床族群，並在不同的研究設計中被觀察到。","Frequency of the abuse and the identity of the abuser are important moderators of suicide risk.|虐待的頻率與施虐者的身分，是自殺風險的重要調節因子。","Abuse perpetrated by an immediate family member carries greater risk of suicidal behavior than abuse committed by an extended family member or an unrelated individual, suggesting that it is the psychological trauma associated with the maltreatment rather than the actual physical or sexual experience that confers the lifelong increased risk of suicidal behavior.|由直系親屬施加的虐待，比起由旁系親屬或無親屬關係者所為，帶來更高的自殺行為風險；這顯示造成終身自殺行為風險升高的，是與虐待相關的心理創傷，而非實際的身體或性經驗本身。","Close family members are the main source of support during development and are essential to provide healthy attachment patterns, appropriate emotional regulation to environmental stimuli, and stress resilience.|親近的家人是成長過程中的主要支持來源，對於提供健康的依附模式、對環境刺激適當的情緒調節，以及壓力復原力至關重要。","Thus, the experience of repeated acts of abuse by parental figures, caregivers or other close relatives, signals a hostile and unreliable environment to which the organism may try to adapt by adjusting key response systems, such as those involved in reactivity to stress.|因此，遭受父母形象者、照顧者或其他近親反覆虐待的經驗，意味著環境充滿敵意且不可靠，個體可能試圖透過調整關鍵反應系統（如涉及壓力反應性的系統）來適應。"])+"<div class='note'><b>單字片語</b>：suicide completer 自殺身亡者｜attempter [əˈtɛmptər] 自殺未遂者｜phenotype [ˈfiːnətaɪp] 表現型｜etiological [ˌiːtiəˈlɑːdʒɪkl] 病因學的｜distal [ˈdɪstl] 遠端的｜proximal [ˈprɑːksɪml] 近端的｜robust [roʊˈbʌst] 穩固的｜psychopathology 精神病理｜comorbidity [ˌkoumɔːrˈbɪdəti] 共病｜demoralization [dɪˌmɔːrələˈzeɪʃn] 士氣喪失｜sociodemographic 社會人口的｜constitutional 體質的｜discrete [dɪˈskriːt] 小而獨立的｜familial aggregation 家族聚集｜epidemiological 流行病學的｜coping style 因應風格｜variance [ˈvɛriəns] 變異量｜implicate 牽涉、指出｜early-life adversity [ædˈvɜːrsəti] 早年逆境｜longitudinal [ˌlɑːndʒɪˈtuːdnl] 縱貫的｜manifest [ˈmænɪfɛst] 表現出｜control for 控制（變項）｜moderator 調節變項｜perpetrate [ˈpɜːrpətreɪt] 施行（暴行）｜maltreatment [mælˈtriːtmənt] 虐待｜confer [kənˈfɜːr] 賦予、帶來｜resilience [rɪˈzɪljəns] 復原力｜reactivity 反應性</div><b>參考解答</b><br><b>(1) 摘要</b>：自殺是全球重大公衛問題，死亡人數超過他殺與戰爭總和，且在有效治療下常可預防。<b>近端</b>：精神疾病（尤其 MDD）、物質共病、急性壓力或羞辱拒絕，社會因素調節其影響。<b>遠端</b>：性別、家族史與遺傳、人格與認知因應風格；環境因素解釋大量變異。早年逆境（童年性與身體虐待）是最強遠端因子之一（約 10–40%），控制精神病理後仍有影響；直系親屬施虐、頻率高風險更大，推測因心理創傷與依附、壓力反應系統受損。<br><b>(2) 評論</b>：<b>優點</b>——整合近端與遠端、生物與環境，有縱貫研究支持，「施虐者身分」提供創傷機制線索。<b>限制</b>——①多為相關非因果，未遂與身亡機制不完全相同；②多數有自殺行為者沒有早年逆境史；③回溯性自陳有偏誤；④保護因子著墨少；⑤多來自西方，華人社會的面子、家庭責任、求助污名值得補充。<b>實務啟示</b>——①風險評估須涵蓋精神症狀、近期壓力、創傷史與社會支持；②創傷知情取向；③家庭與學校系統介入；④落實通報轉介並重視保護因子；⑤諮商師自身需督導與自我照顧。"]];

["第一題 助人者的人格特質與自我檢視（25%）","<b>答題架構</b>：①從研究與理論列出關鍵特質並說明理由 → ②連結「典範」與「受傷的療癒者」→ ③誠實檢視自己的優勢與待成長處 → ④說明如何持續發展。<br><b>(1) 助人者應具備的重要特質</b><ul><li><b>真誠一致、無條件正向關注、同理</b>（Rogers 三條件）：促成安全的關係，也是治療者作為「典範」的核心。</li><li><b>自我覺察與心理健康</b>：了解自己的價值觀、議題與限制，能辨識並處理反移情；持續接受督導與個人成長（wounded healer 觀點）。</li><li><b>開放、彈性與包容不確定性</b>：尊重差異，能容忍模糊，不急於給答案。</li><li><b>文化敏感與尊重多元</b>：理解當事人的性別、階層、宗教與文化脈絡。</li><li><b>倫理意識與界線感</b>：保密、避免雙重關係、能清楚設限。</li><li><b>勇氣、耐心與希望感</b>：能陪伴痛苦，相信當事人有改變的潛能。</li><li><b>幽默與生活平衡、終身學習</b>：預防耗竭與替代性創傷。</li></ul><b>(2) 自我陳述寫法（請改成自己的真實經驗）</b><br>結構：「特質→具體經驗→對諮商的幫助→仍需成長之處」。例：「我具備傾聽與耐心，這是在長年與青少年相處的教學現場練習出來的（舉一個與學生談話的具體事件）；我也知道自己容易急於提供解決辦法，因此在督導中練習放慢、先反映感受。」誠實說出限制比一味自誇更能展現自我覺察，也呼應題目「典範」的期待。"],
["第二題 質性與量化研究方法各舉一例（25%）","<b>答題架構</b>：各舉一法 → 概念與適用情境 → 歷程步驟 → 效度（信實度）議題。<br><b>(1) 質性研究：現象學研究（phenomenological research）</b><br><b>概念</b>：探討個體對某一現象的「生活經驗」及其意義本質，如「喪偶者的哀傷經驗」；研究者採「懸置」（epoché／括弧）先入之見，貼近經驗本身。<br><b>歷程步驟</b>：①界定研究現象與問題 → ②立意取樣（約 5–25 位具該經驗者）→ ③深度訪談（半結構），錄音並謄寫 → ④整體閱讀逐字稿 → ⑤萊取有意義的陳述、形成意義單元 → ⑥歸納主題群集 → ⑦整合為經驗的本質結構描述 → ⑧成員檢核與撰寫報告。<br><b>嚴謹度</b>：可信性、可轉移性、可靠性、可確認性（Lincoln & Guba）；三角檢證、反思札記、外部稽核。<br><b>(2) 量化研究：實驗研究（前後測控制組設計）</b><br><b>概念</b>：操弄自變項（如團體諮商），觀察對依變項（如焦慮）的影響，以檢驗因果關係。<br><b>歷程步驟</b>：①提出研究問題與假設 → ②文獻探討與選擇設計 → ③招募並隨機分派實驗組／控制組 → ④前測 → ⑤實施處理（確保處理忠實度）→ ⑥後測與追蹤 → ⑦統計分析（如 ANCOVA，並報告效果量）→ ⑧討論內外在效度威脅與研究限制。"],
["第三題 存在主義取向：中年男子「成功卻覺得生命沒有意義」（25%）","<b>1. 個案概念化</b><ul><li>事業、家庭看似圓滿，卻出現憂鬱與無意義感，是典型的「存在性空虛」（Frankl 的 existential vacuum）與中年轉型危機。</li><li>Yalom 的四大終極關懷：死亡、自由（責任）、孤立、無意義；當成就達成後，個體被迫面對「為何而活」，並承擔自己創造意義的責任。</li><li>先評估：憂鬱症狀嚴重度與自殺風險；必要時轉介精神科評估與藥物，並與妻子共同建立支持網絡。</li></ul><b>2. 諮商目標</b><ul><li>協助個案面對而非逃避存在議題（死亡、自由、孤立、無意義）。</li><li>增進自我覺察，釐清真實價值，區分「他人期待」與「自己想要」。</li><li>發現並創造生命意義，重新投入有意義的生活與關係。</li><li>接納存在的焦慮，將其轉化為成長動力（真實存在 authentic living）。</li></ul><b>3. 處遇計畫</b><ul><li><b>初期</b>：建立真誠的「在場」（presence）關係；評估自殺風險並訂定安全計畫；傾聽憂鬱與空虛的經驗，不急於給答案。</li><li><b>中期（意義探索）</b>：①Frankl 三大意義途徑——創造價值（工作、貢獻）、體驗價值（愛、美、關係）、態度價值（面對無法改變之處境的態度）；②生命回顧與價值澄清（「如果只剩一年，你想做什麼？」）；③蘇格拉底式對話、去反思（dereflection）以減少過度自我關注；④面對死亡焦慮與有限性，轉化為珍惜當下。</li><li><b>後期（行動與整合）</b>：將意義轉為具體行動（培育後輩、志工、重拾被擱置的興趣、深化夫妻與親子關係），並承擔選擇的責任；評估症狀改善，規劃結案與追蹤。</li><li>邀請妻子參與一至兩次會談，增進理解與支持。</li></ul>"],
["第四題 Rogers 心理治療歷程的七個階段（25%）","<b>題意</b>：Rogers 觀察到人格改變是一條「由僵固走向流動」的連續歷程（以下以「對工作感到痛苦的上班族小明」為例）。<div class='v'><table border='1' cellpadding='5' style='border-collapse:collapse;font-size:13px;border-color:var(--bd)'><tr><th>階段</th><th>內涵</th><th>舉例</th></tr><tr><td>第一</td><td>僵固、不願溝通自我；不認為自己有問題，也不想改變；情感被隱藏，經驗與感受疏離</td><td>小明：「我沒問題，是老闆太苛刻。」不想談自己</td></tr><tr><td>第二</td><td>稍有鬆動；談論外在事件與他人，仍否認個人責任，對感受仍疏離，較能被同理</td><td>談到同事如何對他，仍不談自己的感受</td></tr><tr><td>第三</td><td>談論自己，但多為過去式或他人眼中的自己；開始描述感受，但視為「過去的、不屬於現在的」</td><td>「我那時候很生氣，大概是我個性不好。」</td></tr><tr><td>第四</td><td>開始以過去式談較深的感受，偶有現在的感受涌現；仍不信任自己，擔心關係的親密</td><td>說到生氣時聲音哽咽，隨即說：「我不應該有這種感覺。」</td></tr><tr><td>第五</td><td>能在當下自由表達感受，對自己的感受感到驚訝；渴望成為真實的自己，願為自己負責</td><td>「我現在好生氣！原來我一直很氣自己不敢說。」</td></tr><tr><td>第六</td><td>感受被完整、即時地體驗，過去被卡住的感受鬆動；生理放鬆（如流淚、深呼吸）；自我與經驗合而為一，改變不可逆</td><td>哭著說出被壓抑的委屈後，覺得鬆了一口氣、與自己和解</td></tr><tr><td>第七</td><td>成為「功能充分發揮的人」：信任歷程，以新鮮方式體驗感受，自我成為流動的過程；能在關係與生活中自在調適，改變在治療外持續發生</td><td>在工作中能清楚表達需求、接納情緒，並從容面對挑戰</td></tr></table></div><b>評論重點</b>：此模型強調治療條件（真誠、無條件正向關注、同理）促成改變；不是每個人都會走完七階段；個案在不同議題上可能處於不同階段；治療師應依個案所在階段調整同理的深度，不強迫往前推。"]]};

["第一題 諮商中的給建議 advice giving（30%）",S(["The theoretical origins of these ideas deserve investigation.|這些觀念的理論起源值得探究。","In 1930s, Sigmund Freud was already cautioning analysts against giving advice or interpretation (Strean, 1985).|早在 1930 年代，佛洛伊德就已告誡分析師不要給予建議或詮釋。","The reason for this warning is as follows.|這項警告的理由如下。","First, clients’ request for advice is one type of resistance and if analysts gratify such request, they interfere with clients’ psychological growth.|第一，當事人要求建議是一種阻抗，若分析師滿足這種要求，就會干擾當事人的心理成長。","Second, advice giving by analysts is most often a manifestation of an unresolved countertransference problem.|第二，分析師給建議多半是未解決的反移情問題的表現。","Finally, advice rarely works because clients do not want to heal as a result of their unconscious desire for gratification from their problems.|最後，建議很少奇效，因為當事人由於無意識中想從問題中獲得滿足，並不真正想要痊癒。","These ideas gave rise to a long-lasting conviction that advice giving by counselors is inappropriate and nontherapeutic.|這些觀念孕育出一個長久的信念：諮商師給建議是不恰當且無治療效果的。","Similar in nature are the ideas of Alfred Adler, the founder of individual psychology, who suggested that the request and provision of information are valid activities, whereas the seeking and reception of advice are the clients’ method for sabotaging or prolonging therapy.|性質相似的是個體心理學創始人阿德勒的觀點，他認為要求與提供「資訊」是正當的活動，而尋求與接受「建議」則是當事人破壞或拖延治療的手段。","Clients could say that they had tried what therapists advised, and things did not turn out in a way that the clients felt were satisfactory (Mosak & Maniacci, 1998).|當事人可以說他們試過治療師的建議，但結果並不如他們所願。","Adlerian therapists maintain that advice giving should be avoided in order to place responsibility back where it belongs, that is, with the client.|阿德勒學派治療師主張應避免給建議，以便把責任放回它應屬之處，也就是當事人身上。","Likewise, Albert Ellis (2001), the founder of rational-emotive behavior therapy, while using directives and giving clients homework assignments in his own practice, proposed that therapists try to convince clients to direct themselves in order to avoid the trap of client dependency upon therapists.|同樣地，理情行為治療創始人艾里斯（2001）雖在自己的實務中使用指示並給當事人家庭作業，卻主張治療師應努力說服當事人自我引導，以避免陷入當事人依賴治療師的陷阺。","Other cognitive-behavior therapists (e.g., Beck, 1995; Ingram & Scott, 1990), although offering client homework assignments and suggestions, prefer to engage with clients collaboratively and abstain from imposing their own ideas on them.|其他認知行為治療師（如貝克，1995；Ingram & Scott, 1990）雖也提供作業與建議，但偏好與當事人合作，並避免把自己的想法強加於他們。","In the same way, Carl Rogers (1951), an originator of a person-centered approach to counseling, stated that offering advice, suggestions, and judgements is detrimental to the therapeutic enterprise.|同樣地，個人中心取向諮商的創始者之一羅傑斯（1951）指出，提供建議、暗示與評斷有損治療事業。","Within the field of family therapy, a proponent of strategic therapy, Jay Haley (1978), distinguished between a directive and advice.|在家族治療領域，策略學派的倡導者海利（1978）區分了「指令」與「建議」。","He claimed that rather than telling clients what they should do when therapists want them to do it (advice), therapists should direct families to do what therapists hope clients would stop doing (directive).|他主張，治療師不該在希望當事人去做某事時直接告訴他們該做什麼（建議），而應指示家庭去做治療師希望他們停止的事（指令）。","According to Haley, the provision of good advice is useless, as it presumes that people have rational control over what they are doing.|依海利之見，提供好建議是沒用的，因為這預設人們對自己所作所為有理性的控制。","For therapy to be successful, therapists should drop this idea and try to facilitate client-change outside of clients’ awareness, through, for example, paradox.|為使治療成功，治療師應放棄這個想法，嘗試在當事人覺察之外促成改變，例如透過矛盾法。","To summarize, within numerous of approaches to counseling, including family therapy, advice giving by counselors and therapists has been viewed as a form of social control, with the locus of control for treatment lying in the expert hands of the counselor.|總結來說，在包括家族治療在內的眾多諮商取向中，諮商師與治療師給建議被視為一種社會控制，治療的控制中心在於專家諮商師手中。","Major proponents of various schools of psychotherapy have recommended that counselors avoid engaging in advice provision.|各心理治療學派的主要倡導者都建議諮商師避免提供建議。","They suggest that by using this practice, counselors show a desire for control, lack of faith in clients’ resourcefulness and competency, and a naive belief that clients would follow the counselors’ advice.|他們認為，採用此作法，顯示諮商師有控制慘、對當事人的資源與能力缺乏信心，且天真地相信當事人會聽從建議。","From this standpoint, clients—on to whom therapists impose their expertise—are presumed to lack the capacity to negotiate and contest therapists’ ideas.|從此立場看，被治療師強加專業的當事人，被預設缺乏協商與挑戰治療師想法的能力。","They are excluded from the interaction, and therapists are seen as unilateral deliverers of interventions.|他們被排除於互動之外，治療師則被視為單向施予介入的人。","【OFFERING A CHALLENGE 提出挑戰】We wish to challenge this view on advice giving and clients’ role in therapy by introducing an alternative conceptualization of advice giving as a dialogical and sequential performance.|我們希望挑戰這種對建議給予及當事人在治療中角色的看法，提出一種替代的概念化：把給建議視為一種對話式且有先後序列的行動。","Following Tomm (1987), we believe that everything therapists do or say in the course of their interaction with clients is interventive, that is, potentially facilitative of a transformation in clients.|依循 Tomm（1987），我們認為治療師在與當事人互動過程中所做所說的一切都具介入性，也就是可能促成當事人的轉變。","All therapists propose and pursue certain directions for construction of meaning in counseling, whether or not they acknowledge it.|所有治療師在諮商中都會提出並追求某些意義建構的方向，無論他們是否承認。","We advocate for a discursive micro-reflexive practice (we want to thank Jerry Gale for suggesting this term) in place of macro-interventions in discourse.|我們倡議以一種論述性的微觀反思實踐，取代論述中的宏觀介入（感謝 Jerry Gale 建議這個詞）。","Micro-oriented therapists continuously, but not necessarily consciously, orient to the perceived effects of their actions on clients and the therapeutic relationship and modify their further actions on the basis of feedback they receive from clients (Kogan & Brown, 1998).|微觀取向的治療師持續（但未必有意識地）留意自己的行動對當事人及治療關係所產生的可感知效果，並根據從當事人得到的回饋調整後續行動。","These therapists prefer a mutual and spontaneous exchange of actions and ideas in counseling in favor of therapists’ invariable generic knowledge and preplanned interventions.|這些治療師偏好在諮商中雙方相互且自發的行動與想法交流，而非治療師一成不變的通用知識與預先規劃的介入。","In such interactions both therapists and clients become active contributors to the local, ongoing, and joint (re)production of client reality in interaction.|在這種互動中，治療師與當事人都成為積極的貢獻者，在互動中共同、持續、在地地（重新）生產當事人的現實。","Consequently, advice giving as a discursive, micro-reflexive practice includes both information and advice elements, but they are offered in a manner that is respectful and ethical.|因此，作為論述性、微觀反思實踐的給建議，同時包含資訊與建議的成分，但以尊重且合乎倫理的方式提供。","We further argue that advice can have generative and healing potential when it is offered collaboratively and sensitively.|我們進一步主張，當建議以合作且敏感的方式提供時，可具有生成與療癒的潛力。","Anderson (2001) suggested that it is not advice per se that hinders therapy but the manner in which advice is initiated, delivered, and received, that is, the subtleties of the interactional context in which advice is embedded.|Anderson（2001）指出，妨礙治療的並非建議本身，而是建議被發起、傳遞與接收的方式，也就是建議所嵌入的互動脈絡中的細微之處。","We object to dialogue excluding counselor use of advice giving and propose its usefulness when understood as an accomplishment inclusive of what the client offers.|我們反對把諮商師給建議排除於對話之外，並主張當把它理解為一種涵納當事人所提供內容的共同成就時，其具有用處。","Vehviläinen (2001) suggested, “in counseling, which involves a strong orientation to the clients’ autonomy and ‘expertise on their own affairs,’ and to the obligation to respect the client’s experience, advice giving requires particular interactional work on the adviser’s part” (p.373).|Vehviläinen（2001）指出：「諮商高度重視當事人的自主以及『對自身事務的專業』，並有義務尊重當事人的經驗，因此給建議需要建議者在互動上付出特別的功夫。」（第 373 頁）"])+"<div class='note'><b>單字片語</b>：caution sb against 告誡某人不要｜resistance [rɪˈzɪstəns] 阻抗｜gratify [ˈɡrætɪfaɪ] 滿足｜countertransference 反移情｜manifestation [ˌmænɪfɛˈsteɪʃn] 表現｜nontherapeutic 無治療效果的｜sabotage [ˈsæbətɑːʒ] 破壞｜prolong [prəˈlɔːŋ] 拖延｜directive [dəˈrɛktɪv] 指令｜homework assignment 家庭作業｜abstain from [æbˈsteɪn] 避免｜detrimental [ˌdɛtrɪˈmɛntl] 有害的｜strategic therapy 策略治療｜paradox [ˈpærədɑːks] 矛盾法｜locus of control 控制中心｜resourcefulness 資源、足智多謀｜unilateral [ˌjuːnɪˈlætərəl] 單方面的｜dialogical [ˌdaɪəˈlɑːdʒɪkl] 對話式的｜sequential [sɪˈkwɛnʃl] 序列的｜interventive 介入性的｜discursive [dɪˈskɜːrsɪv] 論述的｜micro-reflexive 微觀反思的｜mutual [ˈmjuːtʃuəl] 相互的｜spontaneous [spɑːnˈteɪniəs] 自發的｜generic [dʒəˈnɛrɪk] 通用的｜generative 生成的｜collaboratively 合作地｜per se [ˌpɜːr ˈseɪ] 本身｜subtlety [ˈsʊtlti] 細微之處｜embedded in [ɪmˈbɛdɪd] 嵌入於</div><b>參考解答</b><br><b>(1) 中文分段摘要</b><ol><li><b>傳統觀點的來源</b>：佛洛伊德早已告誡分析師勿給建議，理由：要求建議是阻抗、給建議常是反移情的表現、建議很少奇效。阿德勒學派（責任應回到當事人）、艾里斯（避免依賴、強調自我引導）、認知行為（合作而不強加）、羅傑斯（建議與評斷有損治療）、海利（以指令而非建議，建議假設人能理性控制行為）皆持相近立場。</li><li><b>傳統觀點的共通批判</b>：給建議被視為一種社會控制，顯示諮商師想控制、不信任當事人的能力，並把當事人排除於互動之外，治療師成為單向的專家。</li><li><b>作者的挑戰</b>：把給建議視為「對話式、序列性的行動」；治療師的一言一行本來就具介入性，與其否認，不如採「論述性的微觀反思實踐」——根據當事人的即時回饋調整行動，雙方共同建構意義。</li><li><b>結論</b>：建議可以具療癒潛力，關鍵不在「給不給」，而在「如何給」：合作、敏感、尊重當事人的自主與專業（Anderson；Vehviläinen）。</li></ol><b>(2) 我給建議的做法與最接近的觀點（請依自身經驗調整）</b><br>做法示範：①先理解需求——當事人是想要資訊、想被理解，還是想要指示？②先詢問許可：「我有一些想法，你願意聽聽看嗎？」③提供資訊與多個選項而非單一答案，並以暫時性的語氣（「有些人會……你覺得適合你嗎？」）④觀察當事人的反應與回饋（微觀層次），立即調整；⑤把決定權交還當事人，並探討其執行後的感受。<br>最接近的觀點：作者群所倡議的「對話式、合作式的給建議」（Anderson、Vehviläinen），並兼採阿德勒對「資訊」與「建議」的區分、貝克的合作經驗主義。若自己的背景偏教學或指導，可誠實反思「想幫忙而急於指導」的傾向，並說明以督導與反思練習節制的方式。"],
["第二題 照護提供者的苦（20%）","<b>標題</b>：FROM MYTH TO REALITY: THE SUFFERING OF THE CARE PROVIDER ➜ 從迷思到現實：照護提供者的苦"+S(["What about our suffering?|那我們自己的苦呢？","As has already been suggested, caring for individuals who are dying, and listening to painful, chaotic, or traumatic accounts of the bereaved, is a profound experience that affects most of us and elicits suffering, aspects of which are unavoidable.|如先前所述，照顧臨終者以及聰聽喪親者痛苦、混亂或創傷性的敘說，是一種深刻的經驗，影響我們多數人並引發苦痛，其中某些面向是無可避免的。","Only when we acknowledge our suffering can we begin to cope with it in appropriate ways.|唯有承認自己的苦，我們才能開始以適當方式因應。","However, such an acknowledgment is uncommon in modern societies, which perceive suffering as something that is invariably bad, affecting only the “victims” of illness and death, not the “experts” who help and support them.|然而，這種承認在現代社會並不常見，因為社會認為苦痛一概是壞事，只影響疾病與死亡的「受害者」，而不會影響協助與支持他們的「專家」。","In addition to the suffering we experience in our work, we are often stigmatized or marginalized as a result of our work in death situations.|除了工作中經歷的苦之外，我們也常因從事與死亡相關的工作而被污名化或邊緣化。","Think for a moment about how people react when you tell them that you provide services to dying and/or bereaved people.|想一想，當你告訴別人你為臨終者或喪親者提供服務時，人們如何反應。","Some may react with curiosity or sympathy, asking questions such as “How can you do that job?”|有些人會帶著好奇或同情，問像「你怎麼做得了那份工作？」這樣的問題。","What is left unsaid is that this job is perceived as terrible, horrific, weird, macabre.|沒說出口的是，這份工作被視為可怕、馭人、怪異、陰森。","Others, on the other hand, respond with admiration and put you on a pedestal by distancing themselves from you (e.g., “You are a hero…. I could never work in that field”).|另一些人則報以欽佩，把你捧上神壇，同時與你保持距離（如「你是英雄……我絕對無法在那個領域工作」）。","Finally, there are also those who react with disdain or aversion (e.g., “What a job! It must be very depressing,” “What’s wrong with you?”).|最後，也有人以輕蔑或厭惡回應（如「什麼工作啊！一定很讓人沉沒」、「你是哪裡有問題？」）。","Quite often people perceive us as different because we offer services that are socially unappealing.|人們常因我們提供社會上不討喜的服務，而視我們為異類。","As a result, we end up feeling alienated and discriminated against.|結果，我們感到疏離並受到歧視。","This social discrimination, which can be subtle or overt, appears in different forms:|這種社會歧視可能隱微或明顯，以不同形式出現：","First, it is experienced as a dismissal of our services, which are viewed as unimportant or even unnecessary.|第一，表現為對我們服務的輕視，被認為不重要甚至不必要。","We are not experts who treat and cure people and demonstrate through observable and measurable outcomes the positive effects of our interventions.|我們不是那種治療、治癒人，並以可觀察、可測量的成果展現介入正面效果的專家。","Rather, we are perceived as second-class professionals whose task accompanying people through dying and bereavement is not understood and is therefore considered insignificant.|相反地，我們被視為二流專業人員，陪伴人們度過臨終與哀傷的任務不被理解，因而被認為無足輕重。","Second, it is experienced as a dismissal or negation of our personal experiences.|第二，表現為對我們個人經驗的輕視或否定。","Our family members, friends, and even colleagues who work in different work settings are not interested in listening to stories about loss, dying, and bereavement or cannot stand doing so for too long.|我們的家人、朋友，甚至在不同工作場域的同事，對聽聞失落、臨終與哀傷的故事不感興趣，或無法聽太久。","Sometimes they admit feeling traumatized by our accounts, which are too painful for them to bear.|有時他們承認被我們的敘述震驚受創，因為那些內容太痛苦而難以承受。","Even though they care for us, they tend to interrupt our stories with remarks such as “That’s enough! Let’s talk about something happy,” “You should take your mind off this,” and “Let’s not discuss such topics while we are eating.”|即使他們關心我們，仍常以「夠了！我們聊點開心的吧」、「你該別再想這些」、「吃飯時別談這種話題」等話打斷我們的敘說。","In extreme situations, we are entirely avoided by people who perceive us as death “contaminators” or carriers of the stigma of death.|在極端情況下，我們被完全迴避，因為有人視我們為死亡的「污染者」或死亡污名的帶原者。","Third, social discrimination is experienced as an overt or subtle form of aggression directed at us or at our team because our work elicits anxiety over death and reminds people that we are all mortal.|第三，社會歧視表現為對我們或我們團隊明顯或隱微的攻擊，因為我們的工作引發對死亡的焦慮，並提醒人們我們都終將一死。","Finally, social discrimination occurs when we, in addition to the work we do, are idealized.|最後，社會歧視也發生在我們（連同我們的工作）被理想化的時候。","Invested with heroic, extraordinary, or superhuman abilities and qualities, we are set apart from the rest of society.|被賦予英雄式、非凡或超人的能力與特質，我們被與社會其他人區隔開來。","Being placed on a pedestal may temporarily seduce us; however, such a position fosters feelings of alienation and loneliness and exerts an immense pressure upon us to conform with certain social expectations.|被捧上神壇可能暫時誘惑我們，但這個位置會助長疏離與孤獨，並對我們施加巨大壓力，要求我們符合特定的社會期待。","These expectations are as follows:|這些期待如下：","We must be knowledgeable and skillful in fixing and relieving suffering.|我們必須具備知識與技巧，能修復並減輕苦痛。","We must prevent suffering by not addressing death matters; discussions about death and loss issues can cause more harm than good and can foster despair by taking away hope.|我們必須不談死亡議題以預防苦痛；討論死亡與失落議題弊大於利，並可能奪走希望而助長絕望。","We must display concern yet remain detached from dying and bereaved people in order to ascertain an objective and scientific approach.|我們必須表現關切，卻與臨終者與喪親者保持疏離，以確保客觀科學的取向。","We must protect ourselves by being strong and immune to the suffering of others; death is a reality that we must get used to.|我們必須堅強並對他人的苦痛免疫以保護自己；死亡是我們必須習慣的現實。"])+"<div class='note'><b>單字片語</b>：bereaved [bɪˈriːvd] 喪親的｜elicit [ɪˈlɪsɪt] 引發｜unavoidable 無可避免的｜invariably [ɪnˈvɛriəbli] 一概、總是｜stigmatize [ˈstɪɡmətaɪz] 污名化｜marginalize [ˈmɑːrdʒɪnəlaɪz] 邊緣化｜macabre [məˈkɑːbrə] 陰森的｜pedestal [ˈpɛdɪstl] 基座（put sb on a pedestal 把某人捧上神壇）｜disdain [dɪsˈdeɪn] 輕蔑｜aversion [əˈvɜːrʒn] 厭惡｜alienated [ˈeɪliəneɪtɪd] 疏離的｜discriminate against 歧視｜dismissal [dɪsˈmɪsl] 輕視｜negation 否定｜contaminator 污染者｜overt [oʊˈvɜːrt] 明顯的｜subtle [ˈsʊtl] 隱微的｜mortal [ˈmɔːrtl] 終將一死的｜idealize [aɪˈdiːəlaɪz] 理想化｜superhuman 超人的｜conform with 符合｜detached [dɪˈtætʃt] 疏離的｜ascertain [ˌæsərˈteɪn] 確保、查明｜immune to [ɪˈmjuːn] 對……免疫</div><b>參考解答</b><br><b>(1) 中文重點摘要</b>：照顧臨終者與聰聽喪親者的創傷敘說，對助人者是深刻的經驗，會引發部分無可避免的苦；但現代社會以為苦只屬於「受害者」、不屬於「專家」，因此助人者的苦少被承認；承認才能開始因應。助人者也常承受社會歧視，形式有四：①貶低服務價值（被視為二流專業）；②否定個人經驗（家人朋友不願聽、打斷）；③因喚起死亡焦慮而遭攻擊迴避；④被理想化／英雄化而遭疏離與孤獨。被捧上神壇會帶來四種壓力性期待：必須能修復苦痛、不談死亡以免傷害、關懷卻保持疏離、堅強並對苦痛免疫——這些都是需要被拆解的迷思。<br><b>(2) 我在助人工作中的 suffering 與因應（寫作框架，請換成自己的真實經驗）</b><br>寫法：選一個具體經驗（如：陪伴個案的失落而感到無力、與家人朋友談不下去而孤立、被期待「應該很堅強」、當個案未改善時的自責）→ 描述情緒與身心反應 → 說明因應 → 反思收穫。<br>因應方式：定期個別／團體督導；同儕支持與案例討論；承認並命名自己的感受（不否認、不迴避）；設定工作與生活界線；運動、藝術、宗教或自然等自我照顧；必要時接受個人諮商；把苦轉化為對當事人處境的更深理解（wounded healer）。<br>與本文呼應：拆解「專家不該受苦」的迷思，在被理想化時保持真實，與能理解的人建立連結。"],["第三題 共病 comorbid（25%）",S(["When two disorders or illnesses occur simultaneously in the same person, they are called comorbid.|當兩種疾患或疾病同時發生在同一個人身上，稱為共病。","Surveys show that drug abuse and other mental illnesses are often comorbid.|調查顯示，藥物濫用與其他精神疾病經常共病。","As many as 6 in 10 people who have an illicit drug use disorder also suffer from mental illnesses.|多達十分之六患有非法藥物使用障礙的人，同時也罹患精神疾病。","But the high prevalence of these comorbidities does not mean that one condition caused the other, even if one appeared first.|但這些共病的高盛行率並不表示其中一者導致另一者，即使其中一者先出現。","In fact, there are at least three scenarios that we should consider:|事實上，我們至少應考慮三種情況：","drug abuse can cause a mental illness|藥物濫用可能導致精神疾病","mental illness can lead to drug abuse|精神疾病可能導致藥物濫用","drug abuse and mental disorders are both caused by other common risk factors|藥物濫用與精神疾患皆由其他共同的風險因子所造成","In reality, all three scenarios can contribute, in varying degrees, to the establishment of specific comorbid mental disorders and addiction.|實際上，這三種情況都可能程度不一地促成特定共病精神疾患與成癮的形成。"])+"<div class='note'><b>單字片語</b>：comorbid 共病的｜simultaneously 同時地｜illicit drug 非法藥物｜prevalence 盛行率｜scenario 情況｜lead to 導致｜risk factor 風險因子｜in varying degrees 程度不一地｜addiction 成癮</div>"],["第四題 APA 倫理守則與保密（25%）",S(["APA’s 2002 Ethics Code stipulates that psychologists may only disclose the minimum information necessary to provide needed services, obtain appropriate consultations, protect the client, psychologist or others from harm, or obtain payment for services from a client.|美國心理學會 2002 年倫理守則規定，心理師僅可揭露為提供所需服務、獲得適當諮詢、保護當事人、心理師或他人免於傷害，或向當事人收取服務費用所必需的最少資訊。","To help prevent confidentiality problems, psychologists can:|為協助預防保密問題，心理師可以：","Discuss the limits of confidentiality, including their uses of electronic transmission and the foreseeable uses of confidential information, as soon as possible.|儘早討論保密的限制，包括其對電子傳輸的使用，以及機密資訊可預見的用途。","Ensure the safe storage of confidential records.|確保機密紀錄的安全保存。","At the outset, notify people what will be done with case materials, photos and audio and video recordings, and secure their consent.|一開始即告知當事人個案資料、照片及錄音錄影將如何處理，並取得其同意。","Also, make sure rooms where confidential conversations occur are soundproof.|此外，確保進行機密談話的房間具隔音效果。","Obey mandatory reporting laws.|遵守強制通報法令。","Even if a psychologist believes that reporting abuse could make the situation even worse, “these laws are mandatory reporting laws, not discretionary reporting laws,” says lawyer Mathew D. Cohen, who specializes in representing human-service providers.|即使心理師認為通報虐待可能使情況更糟，專門代理人群服務提供者的律師 Mathew D. Cohen 仍表示：「這些是強制通報法，不是裁量通報法。」","Mandatory reporting laws were not created to have clinicians decide whether abuse or neglect is happening, says Cohen, but to have them bring the facts to the attention of authorities, who will decide.|Cohen 說，強制通報法的設立並非要臨床工作者判定是否發生虐待或疏忽，而是要他們把事實提交給主管機關，由主管機關決定。"])+"<div class='note'><b>單字片語</b>：ethics code 倫理守則｜stipulate [ˈstɪpjuleɪt] 規定｜disclose [dɪsˈkloʊz] 揭露｜consultation 諮詢｜foreseeable [fɔːrˈsiːəbl] 可預見的｜confidential records 機密紀錄｜at the outset 一開始｜secure consent 取得同意｜soundproof [ˈsaʊndpruːf] 隔音的｜mandatory [ˈmændatɔːri] 強制的｜discretionary [dɪˈskrɛʃənɛri] 裁量的｜neglect [nɪˈɡlɛkt] 疏忽｜authorities [əˈθɔːrətiz] 主管機關</div>"]];

["第一題 厭食症高一女生（家族治療觀點）（25%）","<b>選擇學派</b>：家族治療（結構式家族治療為主，輔以 Maudsley 家庭為本治療）。<br><b>1. 個案概念化</b><ul><li>厭食症屬醫療風險疾患，須先評估體重、生命徵象與身體狀況，並與醫師、營養師、精神科組成跨專業團隊；高一為青春期，是自主與認同的發展關鍵期。</li><li>結構式觀點（Minuchin 的心身症家庭）：糾結（過度保護、界線模糊）、僵化、迴避衝突、把病人捲入父母衝突（三角化）；症狀具有「維持家庭穩定」的功能。</li><li>母親社經地位高、獨自陪同，可探討：家庭對成就、體態與完美的期待、母親的焦慮與掌控、父親的角色（是否缺席）、夫妻次系統的狀態、母女關係的糾結。</li></ul><b>2. 諮商目標</b><ul><li><b>短期</b>：確保醫療安全與體重穩定；降低父母對進食的衝突與焦慮；與家庭建立工作同盟（把「疾病」外化，家庭與個案共同對抗它）。</li><li><b>中期</b>：重整家庭結構與界線——強化父母聯盟（夫妻次系統），釐清親子階層；減少糾結、三角化與迴避衝突。</li><li><b>長期</b>：個案發展自主與自我認同，能以語言而非症狀表達需求；家庭有彈性應對青春期議題；預防復發。</li></ul><b>3. 處遇計畫</b><div class='v'><table border='1' cellpadding='5' style='border-collapse:collapse;font-size:13px;border-color:var(--bd)'><tr><th>階段</th><th>重點</th><th>技術舉例</th></tr><tr><td>初期</td><td>加入與評估</td><td>joining、家庭結構圖、家庭午餐會談（觀察進食互動）、症狀外化（「厭食症」是敵人而非女兒）</td></tr><tr><td>中期</td><td>重整結構</td><td>父母暫時負責協助恢復飲食（Maudsley 第一階段）、enactment、劃界線、不平衡、重新框架（症狀是對家庭壓力的訊號）</td></tr><tr><td>後期</td><td>自主與預防</td><td>逐步把飲食控制權交還個案；處理青春期、成就壓力與自我認同；復發預防計畫；追蹤</td></tr></table></div><ul><li>邀請父親與手足參與；個別晤談（如個人中心或認知行為）可並行，處理身體意象與完美主義；與學校輔導與導師合作。</li><li>注意：評估自傷自殺風險，必要時住院；對母親避免責怪，視為資源。</li></ul>"],
["第二題 名詞解釋並舉簡例（25%，每題 5%）","<ol><li><b>Cognitive Distortions（認知扭曲）</b>：Beck 認知治療的核心概念，指系統性的思考錯誤，如全或無、災難化、過度類化、選擇性摘取、讀心術、個人化、情緒化推理、「應該」句型。<i>例</i>：考試失利便想「我是徹底的失敗者」（全或無＋過度類化）。</li><li><b>Organismic Valuing Process（有機體評價歷程）</b>：Rogers 理論，指人天生依據「實現傾向」，以身體與整體感受來評價經驗是否促進成長；在「價值條件」下會被扭曲。<i>例</i>：孩子喜歡畫畫，因父母只稱讚成績而認為畫畫「沒價值」；諮商中重新信任內在感受後，再度投入繪畫。</li><li><b>The Life-style Investigation（生活型態探索）</b>：阿德勒治療的評估階段，透過家庭星座、早期記憶、夢與家庭氣氛，了解個案的虛構目標與私人邏輯。<i>例</i>：早期記憶是「我在角落看大家玩」，可能反映「旁觀者」的生活型態。</li><li><b>Resolution of Transference（移情的解決）</b>：精神分析中，透過詮釋與修通，使移情神經症被理解而化解，個案能區分過去與現在的關係。<i>例</i>：個案對男治療師畏懼權威，經詮釋後覺察是對父親情感的轉移，逐漸能表達不同意見。</li><li><b>Guided Imagery（引導想像）</b>：在放鬆狀態中，引導當事人想像特定情境或影像，用於減敏、情緒調節、資源建立與創傷處理（行為、完形、敘事等取向皆可使用）。<i>例</i>：考前焦慮者先想像安全的海邊，再逐步想像考場並維持放鬆。</li></ol>"],
["第三題 如何證實某理論的療效？（25%）","<b>答題架構</b>：①界定理論與療效指標 → ②研究設計（由弱到強）→ ③控制效度威脅 → ④過程與機轉 → ⑤複製與後設分析 → ⑥倫理。<ol><li><b>操作化</b>：把理論轉為手冊化的治療方案；訓練治療師並監控處理忠實度；定義療效指標（症狀減輕、功能、生活品質、復發率）。</li><li><b>研究設計層次</b>：①單一個案設計（ABAB、多基線）作初探；②準實驗（前後測、等候組）；③隨機臨床試驗（RCT）：隨機分派至實驗組、等候組、安慰劑／常規治療或另一種有效治療。</li><li><b>取樣與統計</b>：以檢定力分析決定樣本數；採意圖治療分析（ITT）；報告效果量與臨床顯著性（如可靠改變指標 RCI）；追蹤評估持續性。</li><li><b>測量</b>：多元來源（自陳、他評、行為）、信效度良好的工具、盲評。</li><li><b>過程與機轉研究</b>：探討中介變項（如治療同盟、認知改變）與調節變項（個案特徵），回答「對誰、如何有效」。</li><li><b>複製與整合</b>：多地點複製、後設分析；質性研究補充個案經驗。注意共同因子與「渡渡鳥效應」，須與其他有效治療比較。</li><li><b>倫理</b>：知情同意、等候組後續提供治療、風險監控、保密。</li></ol>"],
["第四題 西方理論在華人社會的問題與解決（25%）","<b>答題架構</b>：先指出文化差異造成的問題 → 提出解決（文化調適、本土化、研究與訓練）→ 回到實務。<br><b>(1) 可能遇到的問題</b><ul><li><b>自我觀不同</b>：西方強調個人主義、獨立自主；華人多為互依、關係取向，重家庭、孝道與角色責任，「個人需求優先」的目標可能與家庭衝突。</li><li><b>求助與污名</b>：面子與家醒不外揚，心理問題易被污名化；常以身體症狀（身心化）表達情緒，延遲求助。</li><li><b>情緒表達與溝通</b>：含蓄、重和諧，不擅直接表達情緒或面質；沉默可能是尊重而非阻抗。</li><li><b>對專家的期待</b>：期待治療師權威、給建議、短期見效，與非指導取向落差。</li><li><b>家庭與決策</b>：重大決定常由家庭共同參與；單獨個別諮商可能忽略家庭脈絡。</li><li><b>測驗與評估</b>：量表常模、語言與概念等價性不足。</li></ul><b>(2) 解決方式</b><ul><li><b>具備文化敏感度與能力</b>：評估當事人的文化認同與適配程度（如 ADDRESSING 架構），尊重多元。</li><li><b>調整技術</b>：保留理論精神、調整做法——如納入家庭成員、增加心理教育與具體策略、強調優勢與資源、以隱喻與故事代替直接面質、重視關係建立與信任。</li><li><b>本土化與整合</b>：結合華人文化概念（面子、緣、孝道、關係、儒釋道智慧、「中庸」「天人合一」），並參考本土心理學與本土諮商研究。</li><li><b>研究與評量</b>：以本土樣本驗證療效，修訂或發展具信效度的華人量表。</li><li><b>訓練與督導</b>：培養批判性思考，不盲目套用西方理論；以個案為本，持續反思。</li></ul>"]]};

["第一題 繼親家庭（25%）",S(["The most difficult aspect of stepfamily life is parenting.|繼親家庭生活中最困難的面向是親職教養。","Forming a stepfamily with young children may be easier than forming one with adolescent children due to the differing developmental stages.|由於發展階段不同，與年幼孩子組成繼親家庭，可能比與青少年孩子組成來得容易。","Adolescents, however, would rather separate from the family as they form their own identities.|然而，青少年在形成自我認同的同時，寧可與家庭分離。","Recent research suggests that younger adolescents (age 10-14) may have the most difficult time adjusting to a stepfamily.|近期研究指出，較年輕的青少年（10–14 歲）可能最難適應繼親家庭。","Older adolescents (age 15 and older) need less parenting and may have less investment in stepfamily life, while younger children (under age 10) are usually more accepting of a new adult in the family, particularly when the adult is a positive influence.|年紀較長的青少年（15 歲以上）需要較少的教養，也可能較少投入繼親家庭生活；而年幼孩子（10 歲以下）通常較能接受家中新成員，尤其當該成員具正面影響時。","Young adolescents, who are forming their own identities tend to be a bit more difficult to deal with.|正在形成自我認同的年輕青少年，往往較難應付一些。","Stepparents should at first establish a relationship with the children that is more akin to a friend or “camp counselor,” rather than a disciplinarian.|繼親一開始應與孩子建立較像朋友或「營隊輔導員」的關係，而非管教者。","Couples can also agree that the custodial parent remain primarily responsible for control and discipline of the children until the stepparent and children develop a solid bond.|夫妻也可約定，在繼親與孩子建立穩固連結之前，由監護親繼續主要負責孩子的管控與管教。"])+"<div class='note'><b>單字片語</b>：stepfamily [ˈstɛpˌfæməli] 繼親家庭｜adolescent [ˌædəˈlɛsnt] 青少年｜developmental stage 發展階段｜adjust to [əˈdʒʌst] 適應｜investment in 對……的投入｜akin to [əˈkɪn] 類似於｜disciplinarian [ˌdɪsəplɪˈnɛriən] 管教者｜custodial parent [kʌˈstoʊdiəl] 監護親｜discipline [ˈdɪsəplɪn] 管教｜solid bond 穩固的連結</div>"],
["第二題 災難與兒童心理（25%）",S(["The devastating effects of disasters can have tremendous psychological impacts on those directly and indirectly affected.|災難的毀滅性影響，可能對直接與間接受影響者造成巨大的心理衝擊。（註：題本此句末缺 affected，依語意補譯。）","Affected individuals may have various stress reactions that present psychological, as well as physical symptoms.|受影響的個人可能出現各種壓力反應，呈現心理及身體症狀。","Children are no exception--understandably, many young children may feel frightened and confused.|孩子也不例外——可想而知，許多幼兒可能感到害怕與困惑。","Fortunately, most children, even those exposed to trauma, are quite resilient.|所幸，大多數孩子，即使曾暴露於創傷，都相當有復原力。","By creating an open environment where they feel free to ask questions, we can help them cope with stressful events and experiences, and reduce the risk of lasting emotional difficulties.|藉由營造讓孩子能自在發問的開放環境，我們可以協助他們因應壓力事件與經驗，並降低長期情緒困擾的風險。","Although these may be difficult conversations, they are important.|儘管這些可能是困難的對話，卻很重要。","Use words and concepts children can understand.|使用孩子能理解的詞語與概念。","Gear your explanations to the child’s age, language, and developmental level.|讓你的解釋配合孩子的年齡、語言與發展水準。","Be prepared to repeat information and explanations several times.|準備好把資訊與解釋重複好幾次。","Some information may be hard to accept or understand.|有些資訊可能難以接受或理解。","Asking the same question over and over may also be a way for a child to ask for reassurance.|一再問同樣的問題，也可能是孩子尋求安心的方式。","Acknowledge and validate the child’s thoughts, feelings, and reactions.|承認並肯定孩子的想法、感受與反應。","Let them know that you think their questions and concerns are important and appropriate.|讓他們知道你認為他們的問題與擔憂既重要也恰當。","Monitor for physical symptoms including headaches and stomachaches.|留意包括頭痛、胃痛在內的身體症狀。","Many children express anxiety through physical aches and pains.|許多孩子透過身體的疼痛來表達焦慮。","An increase in such symptoms without apparent medical cause may be a sign that a child is feeling anxious or overwhelmed.|這類症狀在無明顯醫療原因下增加，可能表示孩子感到焦慮或不堪負荷。"])+"<div class='note'><b>單字片語</b>：devastating [ˈdɛvəsteɪtɪŋ] 毀滅性的｜tremendous [trɪˈmɛndəs] 巨大的｜stress reaction 壓力反應｜no exception 也不例外｜understandably 可想而知｜resilient [rɪˈzɪljənt] 有復原力的｜cope with 因應｜gear A to B 使 A 配合 B｜reassurance [ˊmriːəˈʃʊrəns] 保證、安心｜validate [ˈvælɪdeɪt] 肯定、認可｜monitor for 留意｜overwhelmed 不堪負荷的</div>"],
["第三題 FTBS 發展的背景、過程和結果（25%）","<div class='note'>你上傳的檔案中，這題的英文文章為空白頁，無法逐句翻譯。以下「背景、過程、結果」依 Pinsof（1979）的摘要資訊整理；FTBS 各編碼類別名稱與信度數值我沒有查到，因此未寫入，請以原文為準。</div><b>FTBS 是什麼</b>：Family Therapist Behavior Scale（家庭治療師行為量表），由 Pinsof（1979）發表於 Family Process（18 卷，451–461 頁），題名「The Family Therapist Behavior Scale (FTBS): Development and Evaluation of a Coding System」。它是一套編碼系統，用來辨識並研究短期、問題導向的家族治療師在晤談中臨床上有意義的口語行為，讓督導與研究者能量化治療師「說了什麼、用了什麼技術」。<br><b>(1) 發展背景</b><ul><li>1970 年代家族治療快速發展，但對「治療師在晤談室裡實際做了什麼」缺乏客觀、可量化的觀察工具，研究多停留在理論主張與個案描述。</li><li>要檢驗治療歷程、比較不同經驗的治療師、進行訓練與督導，需要一套能把治療師口語行為分類並計數的編碼系統。</li><li>因此 Pinsof 針對短期、問題導向的家族治療設計 FTBS，並同時檢驗它是否有效、可靠。</li></ul><b>(2) 發展與檢驗過程</b><ol><li>編制編碼系統：界定與臨床相關的治療師口語行為類別，作為編碼依據。</li><li>效度檢驗（區辨效度）：比較 8 位初學家族治療師（進行被觀察的晤談）與 8 位資深治療師（進行督導晤談）的治療內行為，檢驗量表能否區辨事先預測的顯著差異。</li><li>編碼與信度：兩位編碼者從 16 卷錄影帶中各取三段、每段 5 分鐘的樣本，以 FTBS 編碼，並檢驗評分者間的一致性。</li><li>假設檢定：共提出 16 項研究假設，逐項檢驗。</li></ol><b>(3) 研究結果</b><ul><li>效度結果支持超過半數（50% 以上）的 16 項研究假設，顯示 FTBS 對初學與資深治療師的口語行為有一定的區辨力，具初步效度。</li><li>並非所有假設都獲得支持，作者據此討論研究意涵，並提出未來研究方向（如修訂類別、擴大樣本與情境）。</li></ul><b>(4) 評論與運用（加分）</b><ul><li><b>價值</b>：把治療師行為客觀化，可用於研究、訓練與督導（例如評估初學者的技術使用與督導回饋）。</li><li><b>限制</b>：樣本小（8 對 8）；每卷僅取 5 分鐘片段；只涵蓋口語行為，未含非語言與脈絡；針對短期、問題導向取向，推論有限；屬 1979 年的研究，需更新與文化適配。</li><li><b>後續發展</b>：後來的家族治療技能檢核表等工具也引用此研究，延續以量表評估治療師技能的方向。</li></ul>"],["第四題 治療師之死與專業遺囑（25%）",S(["The review revealed a paucity of peer-reviewed literature on the topic.|回顧顯示，這個主題的同儀審查文獻相當匯乏。","The limited body of articles available focused on how a therapist’s sudden death affects his or her clients, including their relationships with inheriting therapists (the therapist who might see a client immediately after that client’s therapist dies) (Beder 2003; Garcia-Lawson et al. 2000).|現有有限的文章聚焦於治療師猝逝如何影響其當事人，包括他們與「承接治療師」（在某位當事人的治療師過世後立即接手的治療師）的關係。","There were no empirical articles relating to therapist preparation for death in terms of long term protection of clients confidentiality and wellbeing.|沒有任何實徵文章探討治療師就長期保護當事人保密與福祉而為死亡所做的準備。","In short we know very little about how a therapist’s untimely death specifically impacts his or her clients, supervisees, and colleagues.|簡言之，我們對治療師的不幸早逝如何具體影響其當事人、受督者與同事所知甚少。","In their codes of ethics, many mental health professional organizations seem to think of the death of a therapist primarily from the perspective of an “interruption of psychological services” (American Psychology Association, code of ethics, 3.12), or an issue related to the “maintenance, dissemination, and disposal of confidential records” (APA, 6.02).|在倫理守則中，許多心理健康專業組織似乎主要從「心理服務中斷」（APA 守則 3.12）或「機密紀錄的維護、散布與處置」（APA 6.02）的角度看待治療師之死。","In a similar manner, the American Association of Marriage and Family Therapy (AAMFT) mentions the death of the therapist only once related to protection of confidentiality of clients, in parallel with situations where a therapist is moving or closing a practice (2.5).|類似地，美國婚姻與家族治療學會（AAMFT）僅有一次提及治療師之死，且是與保護當事人保密相關，與治療師搬遷或結束執業的情況並列（2.5）。","Yet in a recently proposed revision of the AAMFT code of ethics, new language has been added to section 2.5 that puts death as another event for which a therapist must prepare in order to maintain client confidentiality (AAMFT, code of ethics proposed revisions).|然而在近期提出的 AAMFT 倫理守則修訂案中，第 2.5 節新增了文字，把死亡列為治療師為維護當事人保密而必須預作準備的另一種事件。","The National Association of Social Workers (NASW) also discusses protecting client’s confidentiality in the event of the social worker’s death, incapacitation, or termination of practice (1.07).|全美社會工作者協會（NASW）也討論在社工師死亡、無行為能力或終止執業時，保護當事人保密（1.07）。","While those national-level professional organizations briefly mention the case of therapist’s death from the perspective of the best interest of clients, certain state-level law and codes of ethics for mental health professionals require or advocate for further action.|雖然這些全國性專業組織從當事人最佳利益的角度簡短提及治療師之死，某些州層級的法律與心理健康專業倫理守則卻要求或倡導更進一步的行動。","For example, Florida is the only state that mandates providing public information when a therapist dies, including how his or her clients can obtain their records (Steiner 2007).|例如，佛羅里達州是唯一規定治療師過世時必須提供公開資訊（包括其當事人如何取得紀錄）的州。","In fact, the California Association of Marriage and Family Therapists (CAMFT) has proposed writing a professional will as part of their Code of Ethics:|事實上，加州婚姻與家族治療師協會（CAMFT）已提議把撰寫「專業遺囑」納入其倫理守則：","“Marriage and family therapists, therefore, maintain practices and procedures that assure undisrupted care.|「因此，婚姻與家族治療師應維持確保照護不中斷的作法與程序。","Such practices and procedures may include, but are not limited to, providing contact information and specified procedures in case of emergency, or therapist absence, conducting appropriate terminations, and providing for a professional will.” (Code of Ethic, 1.3; TREATMENT DISRUPTION).|此類作法與程序可包括但不限於：提供緊急狀況或治療師缺席時的聯絡資訊與特定程序、進行適當的結案，以及訂定專業遺囑。」（倫理守則 1.3；治療中斷）","Preparing a professional will is discussed in detail in a later section.|專業遺囑的準備將於後文詳述。","It is clear from these documents that therapists have an ethical duty and responsibility to acknowledge and plan for their death as it relates to their client records, relationships they have with clients, and their associates who stand to inherit clients after a therapist dies.|從這些文件清楚可見，治療師有倫理義務與責任，就其死亡所涉及的當事人紀錄、與當事人的關係，以及將在治療師過世後承接當事人的同事，予以承認並預作規劃。"])+"<div class='note'><b>單字片語</b>：paucity [ˈpɔːsəti] 稀少、缺乏｜peer-reviewed 同儀審查的｜inheriting therapist 承接治療師｜untimely death 不幸早逝｜supervisee [ˌsuːpərvaɪˈziː] 受督者｜interruption 中斷｜dissemination [dɪˌsɛmɪˈneɪʃn] 散布｜disposal [dɪˈspoʊzl] 處置｜in parallel with 與……並列｜incapacitation [ˌɪŋkəˌpæsɪˈteɪʃn] 喪失行為能力｜termination of practice 終止執業｜mandate [ˈmændeɪt] 強制規定｜professional will 專業遺囑｜undisrupted 不中斷的｜stand to (inherit) 將要（承接）｜associate [əˈsoʊsieɪt] 同事、夥伴</div><b>參考解答</b><br><b>(1) 文章重點（中文）</b><ul><li>關於治療師猝逝對當事人、受督者與同事影響的同儀審查文獻極少，亦無實徵研究探討治療師如何為死亡預作準備以長期保護保密與福祉。</li><li>專業倫理守則（APA、AAMFT、NASW）多從「服務中斷」與「紀錄處理」看待治療師之死，且多只簡短提及；AAMFT 新修訂案才把死亡明列為須預作準備之事。</li><li>州層級更進一步：佛羅里達州強制提供公開資訊；加州 CAMFT 倡議「專業遺囑」。結論：治療師有倫理責任為自己的死亡預作規劃，涵蓋當事人紀錄、關係與承接治療師。</li></ul><b>(2) 我對自身死亡議題的思維，以及對諮商專業的影響（寫作框架，請換成自己的觀點）</b><ul><li><b>立論</b>：死亡是所有人的共同命運，治療師並非例外；承認有限性，才能更負責任地面對專業與當事人。</li><li><b>個人思維（請寫真實想法）</b>：如何看待自己的有限、對死亡的情緒、是否做過準備。</li><li><b>對專業的影響</b>：①預先擬定專業遺囑——指定承接者、保管聯絡與紀錄存取方式；②在知情同意階段告知當事人緊急聯絡與中斷時的因應；③留意當事人的失落與依附議題，若治療師離世，提供過渡性安排與哀傷支持；④以自身面對死亡的反思，增進與臨終、喪親當事人工作時的同理與穩定；⑤納入自我照顧與督導，預防耗竭。</li></ul>"]];

["第一題 人類行為與社會科學的研究方法（25%）","<b>答題架構</b>：列出至少三種方法，各以「定義→特色→例子」說明。<div class='v'><table border='1' cellpadding='5' style='border-collapse:collapse;font-size:13px;border-color:var(--bd)'><tr><th>方法</th><th>定義與特色</th><th>例子</th></tr><tr><td>實驗法／準實驗法</td><td>操弄自變項，控制外擾，驗證因果；準實驗無法隨機分派</td><td>比較「認知行為團體」與「等候組」學生在焦慮量表前後測的差異</td></tr><tr><td>調查法</td><td>以問卷或訪談蒐集大樣本資料，描述現況、態度與分布</td><td>調查全國大學生尋求心理諮商的態度與求助障礙</td></tr><tr><td>相關研究法</td><td>探討變項間關聯，不操弄變項，可預測</td><td>分析生活壓力、社會支持與憂鬱症狀的相關與迴歸</td></tr><tr><td>質性研究（現象學、紮根理論、敘事、個案研究）</td><td>深入描述經驗與意義，樣本小、重脈絡與詮釋</td><td>訪談喪偶中年婦女的哀傷經驗，歸納主題</td></tr><tr><td>單一受試設計</td><td>對個案反覆測量，以個案為自己的對照</td><td>以多基線設計評估放鬆訓練對某學生考試焦慮的效果</td></tr><tr><td>行動研究</td><td>實務工作者在實務場域中反覆計畫、行動、觀察、反思</td><td>輔導教師在班級實施情緒教育方案並逐輪修正</td></tr><tr><td>後設分析</td><td>整合多個研究結果，計算整體效果量</td><td>彙整正念減壓對憂鬱的效果研究</td></tr></table></div>"],
["第二題 諮商與輔導場域的研究倫理（25%）","<b>答題架構</b>：以研究歷程（設計→蒐集→分析→發表）列出重點，並連結諮商場域的特殊性（弱勢、雙重角色、保密限制）。<ol><li><b>知情同意（informed consent）</b>：說明目的、程序、風險與利益、保密與其限制（自傷傷人、通報）、自願參與與可隨時退出且不影響其權益；未成年或無行為能力者，須取得法定代理人同意並尊重本人同意（assent）。</li><li><b>自願與無脅迫</b>：諮商場域的當事人與諮商師權力不對等，邀請參與研究不得影響治療或評分；教師研究自己的學生須避免壓力。</li><li><b>避免傷害與風險評估</b>：問卷或訪談可能觸動創傷，須備妥轉介與危機處理機制。</li><li><b>保密與隱私</b>：匿名化、資料編碼、安全保存與銷毀期限；錄音錄影須另行同意；個案資料引用時去識別化。</li><li><b>雙重關係與角色衝突</b>：研究者兼治療者，需審慎處理利益衝突。</li><li><b>欺騙與事後說明（debriefing）</b>：非必要不使用欺騙；必要時事後說明。</li><li><b>控制組與等候組的權益</b>：實驗結束後提供相同介入，避免剥奪有效治療。</li><li><b>弱勢族群的保護</b>：未成年、受刑人、精神疾患、被轉介的非自願個案。</li><li><b>研究誠信</b>：不造假、不抄襲、正確署名、如實報告限制與負面結果。</li><li><b>審查與規範</b>：經研究倫理委員會（IRB）審查；遵循《人體研究法》、《個人資料保護法》與諮商心理師倫理守則等。</li></ol>"],
["第三題 名詞解釋並舉簡例（25%，每題 5%）","<ol><li><b>Ego States（自我狀態）</b>：交流分析（Berne）概念，人格由父母（P）、成人（A）、兒童（C）三種自我狀態組成，各有想法、感受與行為模式。<i>例</i>：主管對下屬訓話時（父母），回家對配偶撒嬌（兒童），報表檢核時（成人）。</li><li><b>Splitting（分裂）</b>：客體關係理論的防衛機制，把客體（或自己）分成全好或全壞，無法整合；常見於邊緣型人格。<i>例</i>：個案前週把治療師視為完美救星，一次遲到後突然說治療師「完全不可靠」。</li><li><b>Basic Mistakes（基本錯誤）</b>：阿德勒學派指個體對生活與自己的錯誤信念，如過度類化、錯誤或不可能的安全觀、對生活價值的誤解、貶低或否認自己的價值、錯誤的價值觀。<i>例</i>：「我必須讓每個人喜歡我才安全」（錯誤安全觀）。</li><li><b>Archetypes（原型）</b>：榮格分析心理學，集體潛意識中先天、普遍的原始意象，如人格面具、陰影、阿尼瑪／阿尼姆斯、自性、智慧老人。<i>例</i>：神話、夢中常出現的「英雄」「母親」意象。</li><li><b>Assertion Training（肯定訓練）</b>：行為取向，教導個案區分被動、攻擊與肯定表達，並透過示範、角色扮演、回饋與家庭作業練習。<i>例</i>：以「我訊息」對同事說：「當你臨時改變分工，我會很慌，希望你能提早告訴我。」</li></ol>"],
["第四題 30 歲女性在男友意外過世後出現自傷行為（完形治療觀點）（25%）","<b>選擇學派</b>：完形治療（Gestalt therapy）。<br><b>0. 先處理風險</b>：評估自傷的方式、頻率、嚴重度、是否有自殺意念；訂定安全計畫與危機聯絡方式；了解現有支持系統（家人、朋友），評估是否需精神科或醫療協助；為專業責任應定期督導。<br><b>1. 個案概念化</b><ul><li>至愛意外死亡造成突然、未完成的結束，留下未竟事務（unfinished business）：沒說出口的告別、憤怒、愧疚、遺憾。</li><li>自傷可視為<b>反轉（retroflection）</b>：本應指向外界或逝者的情緒（憤怒、痛苦、思念）轉而指向自己；也可能伴隨內攝（「我早該阻止」「我不配快樂」）與偏離（逃避痛苦的接觸）。</li><li>哀傷歷程中接觸邊界受阻，導致無法完成「悲傷—釋放—整合」的循環。</li></ul><b>2. 諮商目標</b><ul><li>提升此時此地的覺察（身體、情緒、需求），區分「自己的聲音」與內攝的指責。</li><li>完成未竟事務，允許悲傷、憤怒與思念的表達，把情緒由自傷轉為語言與安全的表達。</li><li>整合失落，重建與自己、他人及世界的健康接觸，為自己的選擇負責，逐步恢復生活。</li></ul><b>3. 處遇計畫</b><ul><li><b>初期</b>：建立「我—你」對話關係，不評價；探索自傷時的感受與功能，以覺察取代批判；穩定與安全。</li><li><b>中期（情緒與未竟事務）</b>：①<b>空椅技術</b>——對空椅上的男友說話並交換角色，完成告別、道歉或表達憤怒；②<b>聚焦身體</b>——「疼痛或衝動出現時，身體哪裡有感覺？它想說什麼？」；③<b>誇大與重複</b>——放大細微動作或語詞，連結被壓抑的情緒；④<b>「我」語言</b>取代「你／它」，增加責任感；⑤以夢或意象工作探索哀傷。</li><li><b>後期（整合）</b>：撰寫告別信、設計紀念儀式；重新規劃生活，建立新的支持資源（哀傷團體、朋友）；檢視進展並規劃結案與追蹤。</li></ul><b>注意</b>：喚起情緒時須掌握強度，避免被淹沒；若風險升高，優先安全與轉介。"]]};
