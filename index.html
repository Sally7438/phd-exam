["第一題 感恩與寬恕（30%）",S(["Gratitude and forgiveness are interpersonal strengths that produce well-being through a combination of reflection, positive emotions, and adaptive social behaviors and relationships that facilitate well-being (Fredrickson, 2004; Kashdan, Mishra, Breen, & Froh, 2009; Watkins, 2004).|感恩與寬恕是人際優勢，透過反思、正向情緒，以及促進幸福感的適應性社會行為與關係的結合，產生幸福感。","Empirical data suggests that gratitude and forgiveness are associated with pro-social behavior, positive psychological outcomes such as optimistic appraisals of life, positive memory biases, and relationship satisfaction, physical health benefits, and well-being.|實徵資料顯示，感恩與寬恕與利社會行為、正向心理結果（如對生活的樂觀評價、正向記憶偏誤、關係滿意度）、身體健康益處及幸福感有關。","Gratitude and forgiveness require distinct attributions but share a common, fundamental component of empathy.|感恩與寬恕需要不同的歸因，但共享同一個基本成分：同理心。","Thus, gratitude and forgiveness are conceptually linked as positively valenced, pro-social, empathy-based character strengths associated with psychological and physical health.|因此，感恩與寬恕在概念上相連，同為正向、利社會、以同理為基礎的性格優勢，並與心理及身體健康相關。","Gratitude and forgiveness also evidence similar relations with Big Five personality traits (John & Srivastava, 1999).|感恩與寬恕與五大人格特質也呈現相似的關係。","Forgiveness tends to be positively correlated with agreeableness and negatively correlated with neuroticism.|寬恕傾向與親和性呈正相關，與神經質呈負相關。","A similar profile exists for gratitude (McCullough et al., 2002).|感恩也有類似的樣貌。","More recent work redefining extraversion suggests that it too, may be correlated with gratitude and forgiveness.|較新的、重新定義外向性的研究顯示，外向性也可能與感恩及寬恕相關。","We sought to extend prior findings by examining each character strength in relation to the Big Five while controlling for the unique influence of the other character strength.|我們試圖延伸先前發現，檢驗每一項性格優勢與五大人格的關係，同時控制另一項性格優勢的獨特影響。","The unique qualities of gratitude and forgiveness may be most pronounced in how they relate to emotional vulnerabilities and positive psychological processes.|感恩與寬恕的獨特性，可能最明顯地表現在它們與情緒脆弱性及正向心理歷程的關係上。","In general, empathic emotions tend to increase positive and decrease negative affect (Batson, 1990).|一般而言，同理的情緒傾向增加正向情感、減少負向情感。","Consistent with this theory, grateful people are less likely to respond with anger after being hurt by others.|與此理論一致，感恩的人在被他人傷害後較不會以憤怒回應。","Abandoning angry feelings also appears to be fundamental to forgiveness.|放下憤怒的感受似乎也是寬恕的根本。","As with anger, character strengths also show inverse relations with depressive symptoms.|如同憤怒，這些性格優勢也與憂鬱症狀呈負向關係。","Indirect evidence also suggests that forgiving people may be less lonely.|間接證據也顯示，會寬恕的人可能較不孤單。","For example, forgiveness creates closeness in romantic relationships and promotes social connections in general.|例如，寬恕在親密關係中創造親近感，並一般地促進社會連結。","Thus, character strengths are expected to negatively correlate with emotional vulnerabilities.|因此，預期這些性格優勢與情緒脆弱性呈負相關。"])+"<div class='note'><b>單字片語</b>：interpersonal strength 人際優勢｜well-being [ˌwɛl ˈbiːɪŋ] 幸福感｜adaptive [əˈdæptɪv] 適應性的｜pro-social 利社會的｜appraisal [əˈpreɪzl] 評價｜memory bias 記憶偏誤｜attribution [ˌætrɪˈbjuːʃn] 歸因｜empathy [ˈɛmpəθi] 同理心｜valenced [ˈveɪlənst] 具有（正／負）效價的｜character strength 性格優勢｜Big Five 五大人格｜agreeableness [əˈɡriːəblnəs] 親和性｜neuroticism [nʊˈrɑːtɪsɪzəm] 神經質｜extraversion [ˌɛkstrəˈvɜːrʒn] 外向性｜pronounced [prəˈnaʊnst] 明顯的｜emotional vulnerability 情緒脆弱性｜affect [ˈæfɛkt]（名詞）情感｜inverse relation [ɪnˈvɜːrs] 負向關係｜depressive symptoms 憂鬱症狀｜indirect evidence 間接證據｜promote social connections 促進社會連結</div><b>參考解答</b><br><b>(1) 文章重點（中文）</b><ul><li>感恩與寬恕是以同理為基礎的人際性格優勢，透過反思、正向情緒與適應性社會行為產生幸福感，並與利社會行為、樂觀、關係滿意、身體健康有關。</li><li>兩者與五大人格的關係相似（親和性、外向性偏正向，神經質偏負向）；本研究控制彼此的影響後，分別檢視其與人格的關聯。</li><li>兩者的獨特之處在於與情緒脆弱性的關係：同理情緒增加正向、減少負向情感；感恩者較少以憤怒回應，寬恕需要放下憤怒，兩者皆與憂鬱症狀與孤單呈負向關係。</li></ul><b>(2) 個人生命經驗（寫作框架，請換成自己的真實經驗）</b><br>結構：選一至兩個具體事件（需要感恩或寬恕的人、事、時期）→ 描述當時的感受與掙扎（憤怒、委屈、虧欠）→ 如何轉變（時間、對話、同理對方、宗教或書寫）→ 後續影響（關係、情緒、價值觀）→ 對助人工作的啟示。<br>可連結的理論：寬恕需要放下憤怒與歸因的轉變（呼應文中兩者「需要不同歸因」）；以同理為基礎（呼應「共同成分」）；對諮商的啟示：可把感恩日記、寬恕歷程與同理訓練運用於個案，也要避免催促寬恕。誠實說明「寬恕不等於原諒傷害行為」，並可談到自己仍在努力的部分。"],["第二題 心理劇的後設分析結論（20%）",S(["The implications that emerged from the present study concern changing the perception of the empirical validity of psychodrama and its primary techniques, integrating such techniques in a wider group psychotherapy practice, and outlining directions for future psychodrama research.|本研究浮現的意涵，涉及改變人們對心理劇及其主要技術實徵效度的看法、將這些技術整合到更廣的團體心理治療實務中，以及勾勒未來心理劇研究的方向。","Some of these issues are clearly supported by the findings; others, though somewhat speculative, are nonetheless worthwhile considering.|其中部分議題明確獲得研究發現支持；其他雖帶有些許推測性，仍值得考慮。","The first implication addresses the prevailing view toward psychodrama and its techniques.|第一項意涵針對目前對心理劇及其技術的主流看法。","As described earlier, observers of psychodrama have been torn between the favorable clinical impression of the method, on the one hand, and the absence of empirical validation for its multifarious interventions, on the other.|如先前所述，心理劇的觀察者一直在這個方法良好的臨床印象，與其多樣介入缺乏實徵驗證之間搖擺。","The present meta-analysis shows that the overall treatment effect size found for the 25 studies was 0.95, above the cutoff level of 0.80 that customarily indicates a large effect (Cohen, 1992).|本後設分析顯示，25 項研究的整體治療效果量為 0.95，高於慣常表示大效果的 0.80 切截值（Cohen, 1992）。","This effect size is slightly higher than the comparable results commonly reported in the group psychotherapy literature for the effectiveness of group therapy in general (0.50–0.70; Fuhriman & Burlingame, 1994).|此效果量略高於團體心理治療文獻中，一般團體治療效果的可比結果（0.50–0.70）。","Arguably, the elevated effect size might be partly due to the halo effect often associated with psychodramatic interventions.|可以說，效果量偏高可能部分源於心理劇介入常伴隨的月暈效應。","Nonetheless, the overall effect size is certainly congruent with the tendency reported for group psychotherapy in general, a fact that lends credence to the conclusion that the available research demonstrated the empirical validity of the basic psychodramatic techniques (i.e., role reversal and doubling).|然而，整體效果量確實與團體心理治療一般報告的趨勢一致，此事實支持以下結論：現有研究證明了基本心理劇技術（即角色互換與替身）的實徵效度。","This conclusion notwithstanding, the paucity of sound research remains a troubling issue.|儘管有此結論，缺乏嚴謹研究仍是令人困擾的問題。","The 25 studies selected for the present meta-analysis spanned over a period of three decades—by any measure, a poor showing.|本後設分析選取的 25 項研究橫跨三十年——無論以何標準衡量，都是不佳的表現。","True, these studies may not have constituted the entire body of published empirical psychodrama literature.|誠然，這些研究可能並非已發表心理劇實徵文獻的全部。","First, they included only studies published in English.|首先，僅納入以英文發表的研究。","Second, there were other experimental studies published in English not included in the meta-analysis because of incomplete data or weak designs.|其次，另有一些以英文發表的實驗研究，因資料不完整或設計薄弱而未納入。","Our selection aimed at representing the best studies available.|我們的選擇旨在代表現有最好的研究。","Obviously, the paucity of studies is an unwelcome trend.|顯然，研究稀少是令人不樂見的趨勢。","The second implication of the present study is, therefore, that if one reason for past diminished research activities has been a view that psychodrama is not amenable to traditional, quantitative research, the results of the present meta-analysis ought to dispel that notion.|因此，本研究的第二項意涵是：如果過去研究活動減少的原因之一，是認為心理劇不適合傳統量化研究，那麼本後設分析的結果應能消除這種想法。"])+"<div class='note'><b>單字片語</b>：implication 意涵｜psychodrama [ˈsaɪkoʊˌdrɑːmə] 心理劇｜empirical validity 實徵效度｜speculative 推測性的｜prevailing [prɪˈveɪlɪŋ] 主流的｜be torn between 在……之間搖擺｜multifarious [ˌmʌltɪˈfɛriəs] 多樣的｜meta-analysis 後設分析｜effect size 效果量｜cutoff level 切截值｜customarily 慣常地｜halo effect [ˈheɪloʊ] 月暈效應｜congruent with 與……一致｜lend credence to 使……更可信｜role reversal 角色互換｜doubling 替身（雙重）｜notwithstanding 儘管｜paucity [ˈpɔːsəti] 缺乏｜span 橫跨｜constitute 構成｜amenable to [əˈmiːnəbl] 適合於｜dispel a notion 消除某種想法</div><b>參考解答</b><br><b>(1) 重點（中文）</b><ul><li>後設分析 25 項研究，心理劇整體效果量 0.95（大效果），略高於一般團體治療（0.50–0.70），顯示基本技術（角色互換、替身）具實徵效度，改變過去「臨床印象佳但缺乏證據」的看法。</li><li>效果量偏高可能受「月暈效應」影響，但仍與團體治療趨勢一致。</li><li>然而三十年僅 25 項合格研究，品質與數量都不足；納入限制包括僅英文、排除資料不全或設計薄弱的研究。</li><li>作者主張：心理劇並非不能做量化研究，應增加嚴謹研究。</li></ul><b>(2) 對結論的意見</b><ul><li><b>贊同之處</b>：以效果量取代主觀印象，為心理劇提供實證支持；呼籲研究者以量化方法檢驗，符合實證取向。</li><li><b>質疑與限制</b>：①後設分析受「垃圾進、垃圾出」限制，納入研究的品質與異質性（對象、處遇、測量不同）需檢視；②出版偏誤（file-drawer problem）可能高估效果；③僅納入英文研究，缺乏跨文化證據；④月暈效應與期待效應（缺乏盲評）難以排除；⑤只驗證「角色互換與替身」，其他技術與整體處遇的效果未明；⑥心理劇的歷程與經驗層面，也需質性研究補充。</li><li><b>建議</b>：增加設計嚴謹的 RCT 與追蹤，納入華人樣本與文化調適，結合質性與歷程研究。</li></ul>"],["第三題 憤怒與攻擊（25%）",S(["Angry thoughts may be accompanied by muscle tension, headaches or an increased heart rate.|憤怒的想法可能伴隨肌肉緊繃、頭痛或心跳加快。","In addition, the verbal and physical expressions of anger may serve as a warning to others about our displeasure.|此外，憤怒的言語與身體表達，可能作為對他人表示我們不悅的警告。","The verbal expressions include yelling, arguing, cursing and sarcasm.|言語表達包括吼叫、爭吵、咒罵與諷刺。","However, anger can also be expressed physically by raising a clenched fist, throwing a book on the floor, breaking a pencil or hitting a wall.|然而，憤怒也可透過身體表達，如舉起握緊的拳頭、把書摔在地上、折斷鉛筆或搥牆。","Sometimes, anger is not expressed externally but remains as internal rumination.|有時憤怒並未向外表達，而是以內在反芻的形式持續存在。","Aggression, in contrast, refers to intentional behavior that aims to harm another person.|相對地，攻擊指的是意圖傷害他人的有意行為。","Often, it reflects a desire for dominance and control.|它往往反映出支配與控制的欲望。","In the cases I see in my clinical and research work, weapons are often involved.|在我臨床與研究工作所見的案例中，常涉及武器。","Aggression can be shown by punching, shoving, hitting or even maiming another person, and it can occur in marital violence, child or elder abuse, bullying or gang and criminal activities.|攻擊可表現為揮拳、推擠、毆打甚至使他人殘廢，並可發生於婚姻暴力、兒童或老人虐待、霸凌，或幫派與犯罪活動中。"])+"<div class='note'><b>單字片語</b>：muscle tension [ˈmʌsl ˈtɛnʃn] 肌肉緊繃｜displeasure [dɪsˈplɛʒər] 不悅｜yell [jɛl] 吼叫｜curse [kɜːrs] 咒罵｜sarcasm [ˈsɑːrkæzəm] 諷刺｜clenched fist [klɛntʃt fɪst] 握緊的拳頭｜rumination [ˌruːməˈneɪʃn] 反芻（思維）｜aggression [əˈɡrɛʃn] 攻擊｜intentional [ɪnˈtɛnʃənl] 有意的｜dominance [ˈdɑːmɪnəns] 支配｜shove [ʃʌv] 推擠｜maim [meɪm] 使殘廢｜marital violence [ˈmærɪtl ˈvaɪələns] 婚姻暴力｜elder abuse [ˈɛldər əˈbjuːs] 老人虐待｜gang [ɡæŋ] 幫派</div>"],
["第四題 創傷事件（25%）",S(["A trauma event can be human-made, such as a car accident, school shooting, street violence, family violence, etc.|創傷事件可能是人為的，如車禍、校園槍擊、街頭暴力、家庭暴力等。","There are also natural trauma events, such as tornados, hurricanes, floods, earthquakes, fires, etc.|也有自然的創傷事件，如龍捲風、颶風、洪水、地震、火災等。","Trauma events may impact people directly or indirectly.|創傷事件可能直接或間接影響人們。","Indirect exposure may include seeing the disaster on television or hearing stories about others’ experiences, possibly including risk of physical harm or death.|間接暴露可能包括在電視上看到災難，或聽聞他人的經驗，其中可能包含身體傷害或死亡的風險。","Regardless of how individuals experienced the trauma/disaster, it is during this time that people might experience intense fear, helplessness, and hopelessness that exceed normal coping skills.|不論個人如何經歷創傷／災難，正是在這段期間，人們可能體驗到超出正常因應能力的強烈恐懼、無助與絕望。"])+"<div class='note'><b>單字片語</b>：human-made [ˌhjuːmən ˈmeɪd] 人為的｜tornado [tɔːrˈneɪdoʊ] 龍捲風｜hurricane [ˈhɜːrəkeɪn] 颶風｜direct／indirect exposure [ɪkˈspoʊʒər] 直接／間接暴露｜helplessness [ˈhɛlpləsnəs] 無助｜hopelessness [ˈhoʊpləsnəs] 絕望｜exceed [ɪkˈsiːd] 超過｜coping skills [ˈkoʊpɪŋ] 因應能力｜regardless of [rɪˈɡɑːrdləs] 不論</div>"]];

["第一題 疑似飲食疾患的高二女生（認知行為治療觀點）（25%）","<b>選擇學派</b>：認知行為治療（以 CBT-E 為參考架構）。<br><b>0. 評估與安全</b>：個案由母親陪同、「疑似」飲食疾患，故先做評估——飲食與體重變化、催吐、瀉藥、過度運動、月經、頭暈心悸等身體狀況，並轉介醫師（身體評估與必要時營養、精神科）；評估憂鬱、自傷自殺風險；與家長說明保密與限制，並取得家長合作。<br><b>1. 個案概念化（認知行為模式）</b><ul><li><b>核心</b>：過度重視體型與體重，並以此評價自我價值（核心認知）。</li><li><b>認知扭曲</b>：全或無（「吃一口就會失控」）、災難化、情緒化推理（「我覺得胖就是胖」）。</li><li><b>行為維持因素</b>：嚴格節食、規則僵化、身體檢查與迴避、補償行為（催吐、過度運動）。</li><li><b>成因與維持</b>：完美主義、低自尊、人際與課業壓力、青春期身體變化、家庭互動、同儕與媒體比較。</li></ul><b>2. 諮商目標</b><ul><li><b>短期</b>：建立同盟與動機；恢復規律飲食與身體安全。</li><li><b>中期</b>：修正對體型、體重與進食的認知扭曲；減少補償行為；改善身體意象。</li><li><b>長期</b>：減少以體型定義自我價值，發展多元的自我評價與情緒因應；預防復發。</li></ul><b>3. 處遇計畫（階段式）</b><div class='v'><table border='1' cellpadding='5' style='border-collapse:collapse;font-size:13px;border-color:var(--bd)'><tr><th>階段</th><th>重點</th><th>技術</th></tr><tr><td>第一階段</td><td>同盟、心理衰生教育、動機</td><td>共同擬定概念化圖、動機式晤談、利弊分析；飲食日誌（自我監測）；建立規律進食（三餐＋點心）</td></tr><tr><td>第二階段</td><td>檢視進展與弱點</td><td>回顧日誌、討論障礙、決定介入重點</td></tr><tr><td>第三階段</td><td>核心認知與行為</td><td>認知重建（辨認扭曲、蘇格拉底式提問）、行為實驗（吃「危險食物」看災難是否發生）、減少檢查與迴避、處理情緒與人際壓力、完美主義</td></tr><tr><td>第四階段</td><td>維持與預防復發</td><td>辨識高風險情境、擬定復發預防計畫、追蹤</td></tr></table></div>邀請家長參與（親職教育：避免對食物與體型過度評論、支持規律進食），尊重個案自主；與學校導師、輔導室合作。"],
["第二題 名詞解釋並舉簡例（25%，每題 5%）","<ol><li><b>Dichotomous Thinking（二分法思考）</b>：Beck 認知治療的認知扭曲之一，以「全有或全無、非黑即白」看事情。<i>例</i>：考試只考 85 分，就認為「我完全是失敗者」。</li><li><b>Egogram（自我狀態圖）</b>：交流分析（Berne、Dusay）以柱狀圖呈現個人在批判型父母（CP）、撫育型父母（NP）、成人（A）、自由兒童（FC）、順從兒童（AC）五種自我狀態的能量分布。<i>例</i>：某人 CP 很高、FC 很低，顯示嚴苛、缺少自在與玩樂。</li><li><b>Family Constellation（家庭星座）</b>：阿德勒治療的概念，指個人出生序、手足位置與家庭成員互動所構成的家庭氛圍，影響其生活型態。<i>例</i>：長子女常被賦予責任，可能發展成負責、追求完美；幾子女可能依賴或追求被注意。</li><li><b>Logotherapy（意義治療）</b>：Frankl 創立，人的基本動機是追求意義；透過創造、體驗與態度三種價值，以及矛盾意向、去反思，協助找到意義。<i>例</i>：失業者重新思考「這段經歷想教我什麼」，並以志工服務創造意義。</li><li><b>Mindfulness（正念）</b>：Kabat-Zinn 提出，有意圖地、不評價地覺察當下。應用於 MBSR、MBCT。<i>例</i>：焦慮者練習專注呼吸，觀察「念頭只是念頭」，而不被念頭牦著走。</li></ol>"],
["第三題 以中文解釋下列名詞（20%，每題 5%）","<ol><li><b>Phenomenology（現象學）</b>：哲學與質性研究取向（Husserl），主張回到「事物本身」，以懸置（括弧）先入之見，描述個體對某現象的生活經驗與意義本質。</li><li><b>Time-series design（時間序列設計）</b>：對同一對象或群體在介入前後多次重複測量，以觀察趨勢是否因介入而改變；可為單組或加入對照組，屬準實驗設計。</li><li><b>Narratology（敘事學）</b>：研究敘事（故事）結構、形式與意義的學問，探討敘事如何被建構與詮釋；在諮商中，延伸到敘事治療與敘事研究，關注個人生命故事的情節、角色、主題與意義。</li><li><b>Reversal replication designs（逆轉重複設計）</b>：單一受試設計，如 ABA、ABAB：先測基線（A），介入（B），再撤除介入（A）觀察行為是否回到基線，再重新介入（B）重複驗證，以證明介入與行為改變的因果關係。</li></ol>"],
["第四題 Gordon（1967）的問題：諮商研究發展與研究計畫（30%）","<b>(1) 對諮商與心理治療研究發展的看法</b><br><b>研究發展脈絡</b>：由「諮商有效嗎？」（Eysenck 的質疑），到「對誰、何種情境、何種治療有效？」（Gordon／Paul 問題），再到過程與機轉研究（如何有效）、共同因子與治療關係、實證支持的治療（EST）與以實務為本的證據（PBE），並走向整合量化、質性與混合方法。<br><b>我的看法</b>：①需要多元設計（RCT、單一受試、質性）以補強；②重視過程與中介／調節變項；③納入文化與多元（本土化、華人樣本）；④縮短研究與實務的距離（實務工作者參與研究、持續回饋監測）；⑤重視倫理與可複製性。<br><b>(2) 研究計畫範例</b><ul><li><b>題目</b>：正念減壓團體對大學生焦慮、情緒調節與正念程度之成效研究</li><li><b>研究目的</b>：①檢驗正念減壓團體是否降低大學生焦慮、提升情緒調節；②探討正念程度的中介效果；③了解成員參與經驗。</li><li><b>研究假設</b>：實驗組在後測及追蹤測的焦慮顯著低於控制組，情緒調節與正念顯著高於控制組。</li><li><b>研究對象</b>：某大學自願、焦慮量表高分的大學生 60 人（以檢定力分析決定），隨機分派至實驗組（30）與等候控制組（30）；排除嚴重精神疾患與自殺風險者（轉介）。</li><li><b>研究架構</b>：2（組別）×3（前測、後測、三個月追蹤）混合設計；自變項為「正念減壓團體 8 週，每週 2 小時」；依變項為焦慮、情緒調節、正念；中介變項為正念程度。</li><li><b>研究工具</b>：貝克焦慮量表（BAI）或 GAD-7、情緒調節困難量表（DERS）、五面向正念量表（FFMQ）；參與經驗訪談大綱（質性補充）。</li><li><b>研究程序</b>：招募與篩選→知情同意→前測→團體介入→後測→三個月追蹤→等候組補提供介入。</li><li><b>資料分析</b>：混合設計變異數分析（或 ANCOVA 控制前測）、效果量、中介分析；質性資料以主題分析，進行三角檢證。</li><li><b>倫理</b>：知情同意、自願與退出權、保密、等候組後續提供、風險因應。</li><li><b>限制</b>：樣本來自單一學校、自選樣本影響外推、等候組無法排除期待效應、追蹤期短。</li></ul>"]]};

["第一題 次級創傷壓力與同理（25%）",S(["There are two kinds of empathy.|同理心有兩種。","Cognitive empathy is the counselor’s ability to cognitively understand the trauma-effected person’s experience, narrative, and meaning of it.|認知同理是諮商師在認知上理解受創者的經驗、敘事及其意義的能力。","The other kind of empathy, affective empathy, is the counselor’s ability to feel some of the client’s emotions, such as anger, fear, helplessness, hopelessness, etc.|另一種同理——情感同理——是諮商師感受當事人部分情緒的能力，如憤怒、恐懼、無助、絕望等。","Both cognitive and affective empathy put the counselor at risk of developing secondary traumatic stress.|認知同理與情感同理都使諮商師有發展出次級創傷壓力的風險。","Other factors that can contribute to the development of secondary traumatic stress include:|其他可能促成次級創傷壓力的因素包括：","Aspects of the nature of the clientele, such as client needs, confidentiality, ethical, and legal constraints.|服務對象性質的面向，如當事人需求、保密、倫理與法律的限制。","The work setting, such as overall caseload, trauma-effected caseload, long workdays, etc.|工作情境，如整體個案量、受創個案量、工時過長等。","Lack of trauma-specific training and supervision.|缺乏創傷專門訓練與督導。","Personal circumstances, such as current or chronic life stressors, mental health issues, unclear world view, and/or unresolved trauma issues.|個人處境，如當前或長期的生活壓力源、心理健康問題、世界觀不清晰，及／或未解決的創傷議題。"])+"<div class='note'><b>單字片語</b>：cognitive／affective empathy [ˈkɑːɡnətɪv / əˈfɛktɪv ˈɛmpəθi] 認知／情感同理｜trauma-effected（即 trauma-affected）受創的｜narrative [ˈnærətɪv] 敘事｜helplessness 無助｜hopelessness 絕望｜secondary traumatic stress [ˈsɛkəndɛri trɔːˈmætɪk] 次級創傷壓力｜contribute to [kənˈtrɪbjuːt] 促成｜clientele [ˌklaɪənˈtɛl] 服務對象｜constraint [kənˈstreɪnt] 限制｜caseload [ˈkeɪslloʊd] 個案量｜world view 世界觀｜unresolved 未解決的</div>"],
["第二題 迴避、抑制與痛苦的成因（25%）",S(["Research shows that causes of avoidance, inhibition, distress can include:|研究顯示，迴避、抑制與痛苦的成因可能包括：","Temperament or Biological Influences|氣質或生理影響","Withdrawn, avoidant, excessively emotionally reactive|退縮、迴避、情緒反應過度","Highly sensitive, when lacking adequate social support|高度敏感，且缺乏足夠的社會支持","Poor emotional “fit” with family members or some environments|與家人或某些環境的情緒「適配度」不佳","Stressful Life Events|壓力性生活事件","Shaming experiences|羞辱的經驗","Major moves from one school or city to another|從一所學校或城市大幅搬遷到另一處","Abrupt changes or disruptions in family life|家庭生活突然的改變或中斷","Negative Family Interactions|負向的家庭互動","Frequent parental criticism and shaming to enforce behavioral compliance, high parental control with little expressed warmth|父母為強制行為服從而頻繁批評與羞辱，高度控制而少有溫暖的表達","Chaotic family interactions or neglect|混亂的家庭互動或忽視","Stressful Work or School Environments|壓力性的工作或學校環境","Highly competitive, critical, or hostile environments|高度競爭、批判或敵意的環境","Public embarrassment for poor performance|因表現不佳而當眾難堪","Dominance behaviors rewarded, and bullying or teasing ignored or encouraged|支配行為受到獎勵，霸凌或戲弄被忽視或鼓勵"])+"<div class='note'><b>單字片語</b>：avoidance [əˈvɔɪdns] 迴避｜inhibition [ˌɪnɪˈbɪʃn] 抑制｜distress [dɪˈstrɛs] 痛苦｜temperament [ˈtɛmprəmənt] 氣質｜withdrawn [wɪðˈdrɔːn] 退縮的｜avoidant [əˈvɔɪdnt] 迴避型的｜reactive [riˈæktɪv] 反應強烈的｜fit [fɪt] 適配｜shaming [ˈʃeɪmɪŋ] 羞辱｜abrupt [əˈbrʊpt] 突然的｜disruption [dɪsˈrʊpʃn] 中斷｜compliance [kəmˈplaɪəns] 服從｜neglect [nɪˈɡlɛkt] 忽視｜hostile [ˈhɑːstl] 敵意的｜embarrassment [ɪmˈbærəsmənt] 難堪｜dominance 支配｜tease [tiːz] 戲弄</div>"],
["第三題 跨代聯盟（逐句翻譯＋個人經驗與文化評論）（25%）",S(["Many children caught in cross-generational alliances have problems with individuation and emancipation.|許多陷入跨代聯盟的孩子，在個體化與自立上有困難。","If the mother and father have a primary marital coalition, children are free to grow up.|若父母之間有首要的婚姻聯盟，孩子就能自由成長。","As young adults, they can leave home successfully while still preserving close ties and involvement; they do not have to emotionally disengage or physically break off contact with the family.|成年初期，他們能順利離家，同時保有親近的連結與投入；不必在情感上抽離，或在身體上與家庭斷絕往來。","This is possible because the parents do not need the child to remain dependent on them in order to fulfill their own lives.|之所以可能，是因為父母不需要孩子持續依賴他們才能使自己的人生圓滿。","In contrast, if the primary coalition is between parent and child, these offspring may feel separation guilt over leaving their parent alone or forsaking their parent to the unfulfilling relationship with the other spouse.|相對地，若首要聯盟存在於親子之間，這些子女可能因離開而讓父／母獨處，或把父／母丟給與配偶之間不滿足的關係，而感到分離罪惡感。","As a result, they are especially likely to feel dissatisfied with their achievements, to be unable to establish fulfilling relationships with others, or to be chronically depressed, as well as many other symptoms and problems that students present in college counseling centers.|結果，他們特別容易對自己的成就感到不滿、無法與他人建立令人滿足的關係，或長期憂鬱，以及學生在大學諮商中心呈現的許多其他症狀與問題。","Thus, cross-generational alliances impose binding loyalty ties that make young adults feel guilty about leaving home, successfully pursuing their own career interests, and establishing satisfying love relationships.|因此，跨代聯盟施加了束縛性的忠誠連結，使年輕成人對離家、成功追求自己的職涯興趣、建立令人滿意的愛情關係感到愧疚。","Although emancipation issues are expressed differently in varying cultures and will reflect a different balance of separateness and relatedness, symptomatic guilt and depression often ensue when offspring are not permitted culturally sanctioned avenues of individuation and coupling.|雖然自立議題在不同文化中的表現不同，也反映不同的分離與連結平衡，但當子女不被允許走文化所認可的個體化與成家途徑時，症狀性的罪惡感與憂鬱往往隨之而來。"])+"<div class='note'><b>單字片語</b>：cross-generational alliance 跨代聯盟｜individuation [ˌɪndɪˌvɪdʒuˈeɪʃn] 個體化｜emancipation [ɪˌmænsɪˈpeɪʃn] 自立、解放｜marital coalition [ˈmærɪtl ˌkoʊəˈlɪʃn] 婚姻聯盟｜disengage [ˌdɪsɪnˈɡeɪdʒ] 抽離｜break off contact 斷絕往來｜separation guilt 分離罪惡感｜forsake [fərˈseɪk] 拋棄｜unfulfilling 不令人滿足的｜chronically [ˈkrɑːnɪkli] 長期地｜binding [ˈbaɪndɪŋ] 束縛的｜loyalty tie 忠誠連結｜separateness／relatedness 分離性／連結性｜symptomatic [ˌsɪmptəˈmætɪk] 症狀性的｜ensue [ɪnˈsuː] 隨之發生｜culturally sanctioned 被文化認可的｜coupling 配對、成家</div><b>評論參考（個人經驗與文化角度，請換成自己的經驗）</b><ul><li><b>理論定位</b>：呼應 Minuchin（跨代聯盟、糾結）、Haley（三角關係）、Bowen（自我分化）；父母聯盟穩固，孩子才有空間分化。</li><li><b>華人文化視角</b>：華人家庭重視孝道、「報恩」與家庭和諧，「親近、照顧父母」被視為美德，不宜簡單把緊密視為病態；但當父母把孩子當成情感依靠（尤其母子聯盟、夫妻疏離），子女常承受「離開就是不孝」的罪惡感，出現在大學階段的憂鬱、自我價值與親密關係困難，與本文描述相符。</li><li><b>個人經驗</b>：可舉所見的案例或身邊經驗（如子女為照顧父母而放棄升學、婚姻選擇受家人影響），說明如何看到「愛」與「束縛」並存。</li><li><b>實務啟示</b>：①以家庭系統視角理解症狀；②不批評父母、承認其付出；③協助個案在「分離」與「連結」間找到文化可接受的平衡（如保持聯繫的獨立）；④必要時邀請父母參與，強化夫妻次系統。</li></ul>"],
["第四題 創傷倖存者與信任（逐句翻譯＋實務啟示）（25%）",S(["To some extent, trust can be developed only over time, with repeated experience of the therapist’s consistency, support, presence, willingness to engage honestly with difficulties, and healthy interpersonal boundaries.|某種程度上，信任只能隨時間發展，透過反覆經驗到治療師的一致性、支持、在場、願意誠實面對困難，以及健康的人際界線。","Survivors develop a number of indirect strategies for dealing with the thorny question of trust.|倖存者發展出一些間接策略，來處理信任這個棘手的問題。","Some have developed “tests” of trust, which may range from outrageous or obnoxious behavior to the expression of needs that are so subtle that it would take a therapist of unusual and exquisite sensitivity to notice them.|有些人發展出對信任的「測試」，範圍從離譜或惹人厭的行為，到表達得極為細微、以致需要極其敏銳的治療師才能察覺的需求。","Other clients take a passive “wait and see” stance; it is safe but it does not give them the opportunity to engage with the environment on their own behalf.|另一些當事人採取被動的「靜觀其變」立場；這雖然安全，卻使他們沒有機會為自己投入環境。","Still others may take a naïve, “trust everyone” stance, which repeatedly results in boundary violations by others and replications of the original abuse.|還有些人可能採取天真的「相信所有人」立場，結果一再遭他人越界，並重演原初的虐待。","All of these indirect strategies with respect to trust can create great confusion in interpersonal relationships, including the relationship between client and therapist, because these strategies are open to such great misinterpretation.|這些關於信任的間接策略都可能在人際關係（包括當事人與治療師的關係）中造成極大混淆，因為這些策略極易被誤解。","Therefore, some of the work of therapy at this phase is to try to make such indirect, covert tests of trust more explicit, so that their meaning can be made clear.|因此，此階段治療的部分工作，是設法讓這些間接、隱蔽的信任測試更為明確，使其意義得以釐清。","Our aim is gradually and gently to make the issue of trust one that we can engage the client in, so that it becomes available as a self function rather than as a passive response.|我們的目標是逐步而溫和地把信任議題變成可與當事人共同投入的議題，使它成為一種可取用的自我功能，而非被動反應。"])+"<div class='note'><b>單字片語</b>：consistency [kənˈsɪstənsi] 一致性｜presence [ˈprɛzns] 在場｜interpersonal boundaries 人際界線｜thorny [ˈθɔːrni] 棘手的｜outrageous [aʊtˈreɪdʒəs] 離譜的｜obnoxious [əbˈnɑːkʃəs] 惹人厭的｜subtle [ˈsʌtl] 細微的｜exquisite [ɪkˈskwɪzɪt] 敏銳細膩的｜stance [stæns] 立場｜on one’s own behalf [bɪˈhæf] 為了自己｜naïve [naɪˈiːv] 天真的｜boundary violation 界線侵犯｜replication [ˌrɛplɪˈkeɪʃn] 重演｜open to misinterpretation 易被誤解｜covert [ˈkoʊvɜːrt] 隱蔽的｜explicit [ɪkˈsplɪsɪt] 明確的｜self function 自我功能｜passive response 被動反應</div><b>實務啟示（參考寫法）</b><ol><li>信任需要時間與重複經驗，因此不急於「要求」信任；以穩定、一致、準時、守界線的行為讓信任慢慢累積。</li><li>把「測試」視為溝通而非挑戰：辨識並以不防衛、不報復的方式回應，並在適當時機溫和地命名（「我留意到你好像在確認我是否會……」）。</li><li>辨識三種信任策略（測試、靜觀其變、誰都信），針對各自的風險工作（被動者鼓勵為自己行動；全信任者學習辨識與界線）。</li><li>把信任變成可共同討論的主題，讓當事人逐步取回主導權，成為「自我功能」。</li><li>治療師要處理自己的反移情與界線，持續督導；遵守倫理，避免過度保證。</li></ol>"]];

["第一題 高雄截治所截治輔導與諮商方案設計＋評估研究計畫（35%）","<b>答題架構</b>：(一) 方案設計（需求評估→理論基礎→目標→內容與階段→實施方式→團隊與銀接）；(二) 研究計畫（題目、目的與假設、方法、限制）。<br><b>(一) 截治輔導與諮商方案</b><ol><li><b>對象與需求評估</b>：收容人多為非自願、對改變矛盾；常見共病（憂鬱、焦慮、創傷、人格問題）、家庭與就業困境、污名；先以成癮嚴重度、動機階段（跨理論模式）、共病、風險進行評估。</li><li><b>理論基礎</b>：跨理論模式（改變階段）＋動機式晤談（MI）＋認知行為與再發預防（Marlatt）＋治療性社區／團體＋家庭系統＋出所銀接。</li><li><b>方案目標</b>：提升截癎動機、辨識與因應高風險情境、改善情緒調節與人際技巧、修復家庭支持、建立出所後生活與就業計畫、降低再用與再犯。</li><li><b>方案內容（分階段）</b><div class='v'><table border='1' cellpadding='5' style='border-collapse:collapse;font-size:13px;border-color:var(--bd)'><tr><th>階段</th><th>重點</th><th>內容</th></tr><tr><td>入所初期</td><td>評估與動機</td><td>結構式評估；個別動機式晤談，探討矛盾（用藥利弊），建立同盟</td></tr><tr><td>中期（核心團體）</td><td>認知與技巧</td><td>成癮與腦的心理衛生教育；認知行為團體（觸發因子、渴求處理、拒絕技巧）；情緒調節與壓力管理（正念、放鬆）；人際與溝通；憤怒管理</td></tr><tr><td>家庭與社會</td><td>修復支持</td><td>家庭探視晤談、家屬團體、家庭溝通；生涯與就業準備</td></tr><tr><td>出所前後</td><td>銀接</td><td>再發預防計畫、毒品危害防制中心與社區醫療銀接、追蹤輔導、同儕支持團體</td></tr></table></div></li><li><b>實施方式</b>：個別晤談與團體並行（每週一次、每次 90–120 分鐘）；併行醫療（截斷、精神科、藥物治療）；跨專業團隊（心理師、社工、管理人員、醫師、觀護人）。</li><li><b>注意事項</b>：非自願個案的關係建立、保密限制與機構管理的衝突、安全與倫理、避免僅靠說教。</li></ol><b>(二) 評估方案的研究計畫</b><ul><li><b>研究題目</b>：動機式晤談結合再發預防團體對截治所收容人截癎動機、自我效能與再用意圖之成效研究</li><li><b>研究目的與假設</b>：①檢驗方案能否提升截癎動機與拒毒自我效能；②降低渴求與再用意圖，及出所後三個月再用率。<i>假設</i>：實驗組在後測與追蹤測的截癎動機與自我效能顯著高於對照組，渴求與再用意圖顯著低於對照組。</li><li><b>研究架構</b>：準實驗設計——2（實驗組／對照組）×3（前測、後測、出所後三個月追蹤）混合設計；自變項為方案介入；依變項為截癎動機、自我效能、渴求、情緒（憂鬱焦慮）與再用情形。</li><li><b>研究對象</b>：該截治所自願參與之收容人，依分區或梁次分配實驗組（約 40 人）與對照組（接受一般截治課程，約 40 人）；以檢定力分析決定樣本數。</li><li><b>研究工具</b>：改變準備度量表（SOCRATES 或 URICA）、藥物拒絕自我效能量表、藥物渴求量表、憂鬱與焦慮量表（如 PHQ-9、GAD-7）；官方再犯與再入所紀錄；質性訪談大綱（補充）。</li><li><b>研究設計與程序</b>：核可與知情同意→前測→實驗組接受 12 週方案（每週一次）→後測→出所後三個月追蹤→分析。資料以混合設計變異數分析（或 ANCOVA）、效果量；再用以存活分析或羅吉斯迴歸；質性資料以主題分析。</li><li><b>研究限制</b>：①未隨機分派，組間可能不等同；②機構情境，社會期許與管理壓力影響自陳；③流失與出所後追蹤困難；④樣本來自單一機構，外推有限；⑤受刑人屬脆弱族群，需特別保護自願性與保密，並確保拒絕參與不影響處遇；⑥追蹤期短。</li></ul>"],
["第二題 研究者只偏好單一研究取向的看法（15%）","<b>立場</b>：不贊成「不管主題為何都只用同一取向」，但理解研究者因專長與訓練而有偏好。<br><b>理由</b><ol><li><b>方法應服務問題</b>：研究問題決定方法——需推論、檢驗因果、比較成效（量化）；需探索經驗、意義、歷程（質性）。固守單一取向，容易「方法決定問題」，把研究限縮在該方法擅長的題目。</li><li><b>各取向的長處與限制互補</b>：量化提供可推論、效果量與可比較，但可能忽略脈絡與意義；質性提供深度與脈絡，但推論性與客觀性受質疑；兩者可互補、三角檢證。</li><li><b>諮商本身是複雜歷程</b>：成效研究需要效果量，過程研究與當事人經驗則需質性；混合方法可同時回答「有沒有效」與「如何有效」。</li><li><b>學術與實務價值</b>：單一取向可能使研究群體窄化、過度依賴某典範，不利理論創新與實務應用。</li><li><b>允許的情況</b>：在專精、問題恰與方法契合時，專注單一方法可累積深度與嚴謹；但仍須說明限制，且不排斥其他取向。</li></ol><b>結論</b>：可有偏好，但不宜固守；理想是以研究問題為核心，具備跨方法素養，必要時採混合方法或與他人合作。"],
["第三題 名詞解釋、所屬學派與實例（20%，每題 5%）","<div class='v'><table border='1' cellpadding='5' style='border-collapse:collapse;font-size:13px;border-color:var(--bd)'><tr><th>名詞</th><th>解釋</th><th>學派</th><th>實例</th></tr><tr><td>(一) choice theory（選擇理論）</td><td>人的行為由內在的五種基本需求（生存、愛與歸屬、權力、自由、樂趣）驅動，行為是選擇，我們能控制的只有自己的行動與思考；強調責任與關係</td><td>現實治療（Glasser）</td><td>對常抱怨的學生：「你想要什麼？你現在的做法讓你更接近想要的嗎？」</td></tr><tr><td>(二) exception questions（例外問句）</td><td>詢問問題「沒發生」或「較不嚴重」的時候，從中找出已有的資源與解決方法</td><td>焦點解決短期治療（de Shazer）</td><td>「這個星期你有哪天比較不想打人？那天做了什麼不同的事？」</td></tr><tr><td>(三) in vivo flooding（現場洪水法）</td><td>讓個案直接、長時間置身於引發焦慮的真實情境中，不逃避，直到焦慮自然下降（消弱）</td><td>行為治療（暴露治療）</td><td>對電梯恐懼者，在治療師陪同下持續搭電梯，直到焦慮下降</td></tr><tr><td>(四) private logic（私人邏輯）</td><td>個人對自己、他人與生活的獨特而主觀的信念，導致錯誤目標與行為；通常在早年形成</td><td>阿德勒個體心理學（Adler）</td><td>「我必須完美，否則沒有人會愛我」→ 過度追求成績、不敢冒險</td></tr></table></div>"],["第四題 翻譯＋工作同盟與真實關係（30%）",S(["Central to integrationism is the notion, substantiated by comprehensive literature reviews and meta-analyses (e.g., Norcross, 2002; Wampold, 2001), that various common factors, particularly the therapeutic relationship, account for change more than a therapist’s choice of theoretical approach.|整合主義的核心觀念——並經由廣泛文獻回顧與後設分析證實——是各種共同因素，尤其是治療關係，比起治療師所選擇的理論取向，更能解釋改變。","The vast theoretical and empirical literature on the therapeutic relationship was initiated by three counseling psychologists, the first of whom was Stanley Strong (1968), who described how therapists enhance their interpersonal power to motivate clients to change.|關於治療關係的大量理論與實徵文獻，是由三位諮商心理學家所開啟，第一位是 Stanley Strong（1968），他描述治療師如何提升自己的人際影響力以激勵當事人改變。","Second was Edward Bordin (1979), who expanded and defined the psychoanalytic concept working alliance (also called therapeutic alliance) in terms that made it relevant to all therapeutic approaches.|第二位是 Edward Bordin（1979），他擴展並界定精神分析的「工作同盟」（亦稱治療同盟）概念，使之適用於所有治療取向。","Third and most recently, Charles Gelso (2002) expanded yet another aspect of the therapeutic relationship, the real relationship.|第三位也是最近的一位，Charles Gelso（2002）擴展了治療關係的另一個面向：真實關係。","Each of these important contributions cannot be overemphasized because therapy success—regardless of theoretical approach—is substantially influenced by the strength and quality of the client-therapist relationship (Norcross, 2002; Wampold, 2001).|這些重要貢獻再怎麼強調都不為過，因為治療成功——無論理論取向為何——在很大程度上受當事人與治療師關係的強度與品質所影響。"])+"<div class='note'><b>單字片語</b>：integrationism [ˈɪntɪɡreɪʃənɪzəm] 整合主義｜substantiate [səbˈstænʃieɪt] 證實｜comprehensive [ˌkɑːmprɪˈhɛnsɪv] 廣泛的｜meta-analysis 後設分析｜common factors 共同因素｜account for [əˈkaʊnt] 解釋（原因）｜initiate [ɪˈnɪʃieɪt] 開啟｜interpersonal power 人際影響力｜working alliance [əˈlaɪəns] 工作同盟｜therapeutic alliance 治療同盟｜real relationship 真實關係｜cannot be overemphasized 再怎麼強調都不為過｜substantially [səbˈstænʃəli] 在很大程度上</div><b>(一) 如何檢核或促成工作同盟（working alliance）</b><br>理論：Bordin 的三成分——目標的共識、任務的共識、情感連結。可由以下面向檢核與促成：<ol><li><b>目標共識</b>：每次晤談是否釐清當事人「想要什麼」？目標是否具體、共同擬定？</li><li><b>任務共識</b>：當事人是否理解並認同諮商的做法（如家庭作業、練習、談論的內容）？是否需要說明理由並徵求同意？</li><li><b>情感連結</b>：信任、被理解、安全感；留意當事人的非語言訊號與參與度。</li><li><b>回饋與評量</b>：使用工作同盟量表（WAI）、療程評量量表（SRS）、成效評量（ORS），定期向當事人詢問「這次對你有沒有幫助？」。</li><li><b>同盟破裂與修復</b>：留意遲到、沉默、爭論、突然缺席等破裂徵兆，開放討論，主動承認並修復。</li><li><b>文化與個別差異</b>：尊重當事人的期待，如華人當事人期待具體建議，調整互動方式。</li><li><b>治療師自我檢核</b>：反思是否過於急著改變、反移情是否影響，並透過督導、同儕回饋改進。</li></ol><b>(二) 怎樣的諮商關係才是 real relationship（真實關係）</b><br>理論：Gelso 將治療關係分為三部分——工作同盟、移情／反移情、真實關係。真實關係指治療雙方作為「真實的人」，彼此之間真誠（genuineness）且依實際樣貌知覺對方（realism；不被移情扭曲）的關係。<ul><li><b>特徵</b>：①雙方真誠不假裝，在專業界線內表現真實的自己；②按當下對方真實的樣子互動，而非投射過往關係；③能實際地感到彼此的關懷、尊重與喜歡；④承認人性的限制，必要時坦誠面對錯誤與限制；⑤有助於建立信任、修復同盟，是改變的基礎。</li><li><b>實務舉例</b>：治療師遲到時坦率道歉；當事人表達感謝或失望，治療師真實回應、不防衛。</li><li><b>提醒</b>：真實關係不等於過度自我揭露或雙重關係，需符合倫理與專業界線，並以當事人福祉為前提。</li></ul>"]]};
const G=(d,k)=>(F[d.y]&&F[d.y][k])||d[k];
let Y=0,T=0,Q="";const $=id=>document.getElementById(id);
let st={};try{st=JSON.parse(localStorage.getItem("phd")||"{}")}catch(e){}
function save(){try{localStorage.setItem("phd",JSON.stringify(st))}catch(e){}}
function render(){
  $("yrs").innerHTML=D.map((d,i)=>`<button class="${i==Y?'on':''}" data-y="${i}">${d.y}</button>`).join("");
  $("t0").className=T==0?"on":"";$("t1").className=T==1?"on":"";
  let list=[];
  if(Q){D.forEach(d=>["th","en"].forEach((k,ti)=>G(d,k).forEach((q,qi)=>{if((q[0]+q[1]).includes(Q))list.push([d.y,ti,qi,q])})))}
  else G(D[Y],T?"en":"th").forEach((q,qi)=>list.push([D[Y].y,T,qi,q]));
  let h=D[Y].en.length==0&&T==1&&!Q?'<p class="note">106 學年度僅有「諮商與輔導之理論與方法」一科。</p>':"";
  h+=list.map(([y,t,qi,q])=>{const k=y+t+qi;return `<details class="q ${st[k]?'done':''}"><summary>${y}｜${q[0]} <span class="tag">${t?'英文文選':'輔導理論'}</span></summary><div class="b">${q[1]}<p><label><input type="checkbox" data-k="${k}" ${st[k]?'checked':''}> 已熟讀</label></p></div></details>`}).join("");
  h+=`<p class="note">100–106 學年度已全數轉為完整內容（英文文選逐句英中對照、理論題參考解答）。涉及個人經驗的題目，請務必換成自己的真實經驗。</p>`;
  $("m").innerHTML=h;enhance();
}
let slow=false;
function speak(x){if(!window.speechSynthesis){alert("此瀏覽器不支援語音播放");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x.replace(/\s+/g," ").trim());u.lang="en-US";u.rate=slow?0.65:0.9;const v=speechSynthesis.getVoices().find(v=>/^en[-_]US/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
function enhance(){document.querySelectorAll("#m .note").forEach(n=>{const b=n.querySelector("b");if(!b||!b.textContent.includes("單字片語"))return;const items=n.textContent.replace(/^單字片語：/,"").split("｜");n.innerHTML="<b>單字片語</b>（點 🔊 聽發音）："+items.map(it=>{const m=it.match(/^\s*([A-Za-z][A-Za-z0-9\-\s\/'’.,()]*?)\s*(?=\[|[^\x00-\x7F]|$)/);if(!m)return it;const w=m[1].replace(/\s*\(.*$/,"").trim();if(!w)return it;return it+" <button class=\"sp\" data-w=\""+w+"\">🔊</button>"}).join(" ｜ ")})}
document.addEventListener("click",e=>{const t=e.target;if(t.classList&&t.classList.contains("sp")){speak(t.dataset.w||t.previousElementSibling.textContent);return}if(t.id=="rt"){slow=!slow;t.textContent=slow?"🐢 慢速":"🔊 正常語速";return}
  if(t.dataset.y!==undefined){Y=+t.dataset.y;Q="";$("s").value="";render()}
  if(t.id=="t0"){T=0;render()}if(t.id=="t1"){T=1;render()}
  if(t.id=="th"){const r=document.documentElement;r.dataset.theme=r.dataset.theme=="dark"?"light":"dark"}
  if(t.dataset.k){st[t.dataset.k]=t.checked;save();t.closest("details").classList.toggle("done",t.checked)}});
$("s").addEventListener("input",e=>{Q=e.target.value.trim();render()});
render();
</script></body></html>
